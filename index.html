{id:"q1022", s:1, c:"1-2-1", ty:"mc", q:"전문 분석 인력을 현업 부서에 배치해 현업 밀착과 전사 협업을 모두 노리는 조직 구조는?", ch:["집중형","기능형","분산형","위원회형"], a:2, lk:"c121",
 ex:"분산형은 분석 인력을 각 현업에 파견한다. 집중형은 별도 전담 조직, 기능형은 현업이 직접 수행."},

/* ===== 과목 2 ===== */
{id:"q2001", s:2, c:"2-1-1", ty:"mc", q:"결측이 '관측된 다른 변수'로는 설명되지만 결측값 자체와는 무관한 메커니즘은?", ch:["MCAR","MAR","MNAR","NI"], a:1, lk:"c201",
 ex:"MAR(무작위 결측): 결측이 관측된 다른 변수와 연관되나 비관측값(자기 자신)과는 무관. 회귀·다중대치로 처리 가능."},
{id:"q2002", s:2, c:"2-1-1", ty:"mc", q:"다중 대치법(Multiple Imputation)의 3단계 순서는?", ch:["대치 → 분석 → 결합","분석 → 대치 → 결합","대치 → 결합 → 분석","수집 → 대치 → 검증"], a:0, lk:"c202",
 ex:"m개의 완성 데이터셋 생성(대치) → 각각 동일 분석 → Rubin 규칙으로 통합(결합). 단순대치를 복수로 시행해 불확실성까지 반영."},
{id:"q2003", s:2, c:"2-1-1", ty:"mc", q:"랜덤 분할 트리에서 더 적은 분할로 고립되는 관측치를 이상치로 판정하는 기법은?", ch:["Z-Score","IQR(상자수염)","Isolation Forest","DBSCAN"], a:2, lk:"c203",
 ex:"Isolation Forest(고립 의사나무)는 이상치가 정상치보다 빨리(경로 짧게) 고립된다는 성질을 이용한다."},
{id:"q2004", s:2, c:"2-1-1", ty:"ox", q:"상자수염그림(IQR) 방법에서는 Q1−1.5·IQR 미만 또는 Q3+1.5·IQR 초과를 이상치로 본다.", ch:["O","X"], a:0, lk:"c203",
 ex:"Tukey의 울타리 기준으로 계수 1.5를 사용한다. Z-Score 방식은 보통 |z|>3."},
{id:"q2005", s:2, c:"2-1-2", ty:"mc", q:"한 번 모형에 추가된 변수는 이후 제거하지 않는 변수 선택 방법은?", ch:["전진 선택법","후진 소거법","단계적 선택법","LASSO"], a:0, lk:"c204",
 ex:"전진 선택법은 기여도 큰 변수를 하나씩 추가하되 제거하지 않는다. 단계적 선택법은 추가 후 재검토해 유의하지 않으면 제거."},
{id:"q2006", s:2, c:"2-1-2", ty:"mc", q:"차원의 저주(curse of dimensionality)에 대한 설명으로 옳은 것은?", ch:["차원이 늘어도 데이터가 조밀해져 성능이 향상된다","차원이 증가하면서 학습데이터 수가 상대적으로 부족해져 성능이 저하된다","차원 축소를 하면 항상 정확도가 올라간다","변수 개수와 무관하게 발생하는 과소적합 현상이다"], a:1, lk:"c205",
 ex:"차원이 늘수록 공간이 희소해져 같은 밀도를 유지하려면 데이터가 기하급수적으로 필요하다. 차원 축소 또는 데이터 증가로 해결."},
{id:"q2007", s:2, c:"2-1-2", ty:"mc", q:"주성분 분석(PCA)에서 제1주성분이 갖는 의미는?", ch:["평균이 가장 큰 방향","데이터의 분산을 가장 많이 설명하는 방향","종속변수와 상관이 가장 큰 방향","결측치가 가장 적은 변수"], a:1, lk:"c206",
 ex:"제1주성분은 분산 최대 방향, 제2주성분은 이에 직교하면서 남은 분산이 최대인 방향. 공분산 행렬의 고유값 분해로 구한다."},
{id:"q2008", s:2, c:"2-1-2", ty:"mc", q:"음수를 포함하지 않는 행렬 V를 V ≈ W·H로 분해하는 기법은?", ch:["SVD","PCA","NMF(음수 미포함 행렬분해)","요인분석"], a:2, lk:"c207",
 ex:"NMF는 모든 원소가 음이 아닌 행렬 분해로, 부분 기반 표현(토픽·부품)에 유리하며 근사해를 구한다."},
{id:"q2009", s:2, c:"2-1-2", ty:"mc", q:"'고객별 최근 3개월 총구매액, 방문 횟수'처럼 원 데이터를 분석 목적에 맞게 종합한 변수는?", ch:["파생변수","요약변수","더미변수","잠재변수"], a:1, lk:"c208",
 ex:"요약변수는 수집 정보를 집계·요약한 것. 파생변수는 조건·함수로 새 의미를 부여한 변수(생년월일→나이 등)."},
{id:"q2010", s:2, c:"2-1-2", ty:"mc", q:"오른쪽으로 심하게 치우친(양의 왜도) 분포를 대칭에 가깝게 만드는 변환은?", ch:["제곱 변환","로그 변환","원-핫 인코딩","최소-최대 정규화"], a:1, lk:"c209",
 ex:"로그 변환은 큰 값을 압축해 양의 왜도(오른쪽 꼬리)를 완화한다. 소득·집값 등에 자주 쓴다."},
{id:"q2011", s:2, c:"2-1-2", ty:"ox", q:"Z-Score 표준화는 데이터를 평균 0, 표준편차 1로 만들고, 최소-최대 정규화는 데이터를 0~1 범위로 만든다.", ch:["O","X"], a:0, lk:"c209",
 ex:"표준화 (x−μ)/σ, 정규화 (x−min)/(max−min). 표준화는 이상치에 덜 민감하다."},
{id:"q2012", s:2, c:"2-1-2", ty:"mc", q:"클래스 불균형 처리에서 소수 클래스 샘플과 최근접 이웃 사이를 보간해 합성 샘플을 만드는 방법은?", ch:["언더샘플링","단순 오버샘플링(복제)","SMOTE","임계값 이동"], a:2, lk:"c210",
 ex:"SMOTE는 단순 복제가 아니라 이웃 사이 보간으로 새 샘플을 '합성'한다. 단순 복제는 과적합 위험."},
{id:"q2013", s:2, c:"2-2-1", ty:"mc", q:"탐색적 데이터 분석(EDA)의 4가지 주제가 아닌 것은?", ch:["저항성","잔차 해석","자료 재표현","모수 추정"], a:3, lk:"c211",
 ex:"EDA 4주제 = 저항성·잔차 해석·자료 재표현·현시성(그래프). 모수 추정은 추론통계 영역."},
{id:"q2014", s:2, c:"2-3-1", ty:"mc", q:"표본분산의 분모가 n이 아니라 n−1인 이유는?", ch:["계산을 간단히 하려고","불편추정량으로 만들기 위해(자유도 손실 보정)","이상치를 제거하기 위해","표준편차와 단위를 맞추려고"], a:1, lk:"c212",
 ex:"표본평균을 이미 사용해 자유도 1을 잃으므로 n−1로 나눠야 모분산의 불편추정량이 된다."},
{id:"q2015", s:2, c:"2-3-1", ty:"mc", q:"분포가 오른쪽으로 긴 꼬리를 가질 때(양의 왜도) 대푯값의 관계는?", ch:["평균 < 중앙값 < 최빈값","최빈값 < 중앙값 < 평균","평균 = 중앙값 = 최빈값","중앙값 < 평균 < 최빈값"], a:1, lk:"c213",
 ex:"양의 왜도에서는 큰 이상값이 평균을 끌어올려 최빈값 ≤ 중앙값 ≤ 평균이 된다."},
{id:"q2016", s:2, c:"2-2-1", ty:"mc", q:"자료의 값 대신 순위를 매겨 계산하며 비선형·이상치에 강한 상관계수는?", ch:["피어슨 상관계수","스피어만 상관계수","공분산","결정계수"], a:1, lk:"c214",
 ex:"스피어만(및 켄달) 상관은 순위 기반이라 단조 관계·서열척도·이상치에 강하다. 피어슨은 선형 관계·연속형."},
{id:"q2017", s:2, c:"2-2-1", ty:"ox", q:"피어슨 상관계수가 0이면 두 변수 사이에는 어떤 관계도 존재하지 않는다.", ch:["O","X"], a:1, lk:"c214",
 ex:"r=0은 '선형' 관계가 없다는 뜻이며, U자형 같은 비선형 관계는 있을 수 있다. 또한 상관은 인과가 아니다."},
{id:"q2018", s:2, c:"2-2-1", ty:"mc", q:"상관계수를 공분산으로부터 구하는 식으로 옳은 것은?", ch:["Cov(X,Y) × σX × σY","Cov(X,Y) / (σX × σY)","Cov(X,Y) + σX + σY","σX × σY / Cov(X,Y)"], a:1, lk:"c215",
 ex:"상관계수 r = Cov(X,Y)/(σX·σY). 공분산을 표준편차의 곱으로 나눠 −1~+1로 표준화한 것."},
{id:"q2019", s:2, c:"2-3-1", ty:"mc", q:"모집단을 겹치지 않는 동질적 층으로 나눈 뒤 각 층에서 임의추출하는 방법은?", ch:["계통추출","층화추출","군집추출","단순무작위추출"], a:1, lk:"c216",
 ex:"층화추출은 층 내 동질·층 간 이질로 나눠 각 층에서 뽑는다. 군집추출은 반대로 이질적 군집을 만들어 일부 군집을 통째로 조사."},
{id:"q2020", s:2, c:"2-3-1", ty:"mc", q:"단위 시간 안에 어떤 사건이 몇 번 발생하는지를 나타내며 평균과 분산이 모두 λ인 분포는?", ch:["이항분포","포아송분포","기하분포","초기하분포"], a:1, lk:"c218",
 ex:"포아송분포는 희귀 사건의 단위시간당 발생 횟수를 모델링하며 E[X] = Var[X] = λ."},
{id:"q2021", s:2, c:"2-3-1", ty:"mc", q:"베이즈 정리에서 P(B|A)에 해당하는 것은?", ch:["사전확률","우도(likelihood)","사후확률","주변확률"], a:1, lk:"c217",
 ex:"P(A)=사전확률, P(B|A)=우도, P(A|B)=사후확률, P(B)=정규화 상수(evidence)."},
{id:"q2022", s:2, c:"2-3-1", ty:"ox", q:"중심극한정리에 따르면 모집단이 정규분포가 아니어도 표본 크기가 충분히 크면 표본평균의 분포는 정규분포에 근접한다.", ch:["O","X"], a:0, lk:"c220",
 ex:"CLT의 핵심은 '모집단 분포와 무관'이다. 보통 n≥30을 충분히 큰 표본으로 본다."},
{id:"q2023", s:2, c:"2-3-1", ty:"mc", q:"표본평균의 표준편차(표준오차)를 표본 크기 n으로 나타내면?", ch:["σ·n","σ/n","σ/√n","σ²/n"], a:2, lk:"c220",
 ex:"표준오차 = σ/√n. n을 4배로 늘리면 표준오차는 절반이 된다."},
{id:"q2024", s:2, c:"2-3-2", ty:"mc", q:"'편향(bias)이 0인 추정량'을 무엇이라 하는가?", ch:["일치추정량","불편추정량","충분추정량","최대우도추정량"], a:1, lk:"c221",
 ex:"E(θ̂) = θ, 즉 편향이 0이면 불편추정량. 불편추정량 중 분산이 가장 작으면 효율적 추정량."},
{id:"q2025", s:2, c:"2-3-2", ty:"mc", q:"모분산을 모르고 표본 크기가 작으며 모집단이 정규분포일 때 모평균의 신뢰구간에 사용하는 분포는?", ch:["표준정규분포(Z)","t분포","카이제곱분포","F분포"], a:1, lk:"c222",
 ex:"σ를 모르고 소표본이면 자유도 n−1의 t분포를 사용한다. σ를 알면 Z, 대표본이면 t≈Z."},
{id:"q2026", s:2, c:"2-3-2", ty:"mc", q:"제1종 오류(α)에 대한 설명으로 옳은 것은?", ch:["거짓인 귀무가설을 기각하지 못하는 오류","참인 귀무가설을 기각하는 오류","대립가설을 채택하는 오류","검정력을 높이는 오류"], a:1, lk:"c223",
 ex:"제1종 오류 = 참인 H₀ 기각(없는 효과를 있다고 함), 확률 α. 제2종 오류 = 거짓인 H₀ 기각 못함, 확률 β. 검정력 = 1−β."},
{id:"q2027", s:2, c:"2-3-2", ty:"ox", q:"p-value가 유의수준보다 작으면 귀무가설을 기각한다.", ch:["O","X"], a:0, lk:"c223",
 ex:"p < α 이면 H₀ 기각. p-value는 '귀무가설을 기각하는 데 필요한 최소 유의수준'으로도 정의된다."},
{id:"q2028", s:2, c:"2-3-2", ty:"mc", q:"두 모집단의 분산이 같은지 검정할 때 사용하는 검정통계량은?", ch:["Z 통계량","t 통계량","F 통계량","상관계수"], a:2, lk:"c224",
 ex:"두 모분산 비 검정은 F = S₁²/S₂². 한 모분산 검정은 카이제곱, 3집단 이상 평균 비교도 F(ANOVA)."},
{id:"q2029", s:2, c:"2-2-2", ty:"mc", q:"텍스트 마이닝과 오피니언 마이닝의 차이로 옳은 것은?", ch:["텍스트 마이닝은 감정 판별, 오피니언 마이닝은 주제 파악","텍스트 마이닝은 주제·핵심어 파악, 오피니언 마이닝은 감정·태도(긍부정) 판별","둘은 완전히 같은 기법이다","오피니언 마이닝은 정형 데이터만 다룬다"], a:1, lk:"c226",
 ex:"오피니언 마이닝(감성 분석)은 텍스트 마이닝의 하위 분야로, 주관적 의견의 긍·부정을 수치화한다."},
{id:"q2030", s:2, c:"2-2-2", ty:"mc", q:"다변량 분석에서 '변수 축약'을 목적으로 하는 기법은?", ch:["군집분석","다차원척도법","주성분분석·요인분석","판별분석"], a:2, lk:"c225",
 ex:"변수 축약(변수유도) = 주성분분석·요인분석·정준상관분석. 개체 유도·분류 = 군집분석·MDS·판별분석."},

/* ===== 과목 3 ===== */
{id:"q3001", s:3, c:"3-2-1", ty:"mc", q:"다음 중 비지도학습에 해당하지 않는 것은?", ch:["K-평균 군집","연관규칙 분석","로지스틱 회귀분석","오토인코더"], a:2, lk:"c301",
 ex:"로지스틱 회귀는 레이블이 있는 지도학습(분류). 군집·연관·오토인코더는 비지도."},
{id:"q3002", s:3, c:"3-2-1", ty:"mc", q:"주어진 환경에서 보상을 최대화하도록 에이전트를 학습시키는 방식은?", ch:["지도학습","비지도학습","준지도학습","강화학습"], a:3, lk:"c301",
 ex:"강화학습은 상태-행동-보상 상호작용으로 정책을 학습한다. Q-러닝, 정책경사(PG) 등."},
{id:"q3003", s:3, c:"3-1-2", ty:"mc", q:"학습 데이터 정확도는 매우 높지만 테스트 데이터 정확도가 낮은 현상은?", ch:["과소적합","과대적합","일반화","정규화"], a:1, lk:"c302",
 ex:"과대적합(과적합)은 모델이 학습 데이터의 노이즈까지 암기한 상태(고분산). 과소적합은 둘 다 낮음(고편향)."},
{id:"q3004", s:3, c:"3-1-2", ty:"ox", q:"테스트(평가) 데이터는 모델 튜닝 과정에서 반복적으로 사용해 최적 하이퍼파라미터를 찾는 데 쓴다.", ch:["O","X"], a:1, lk:"c302",
 ex:"튜닝·모델 선택은 검증(validation) 데이터로 한다. 테스트 데이터는 최종 일반화 성능을 딱 한 번만 측정."},
{id:"q3005", s:3, c:"3-1-2", ty:"mc", q:"R 언어의 단점으로 자주 언급되는 것은?", ch:["시각화 기능이 빈약하다","통계 패키지가 부족하다","대용량 메모리 처리가 어렵다","객체지향을 지원하지 않는다"], a:2, lk:"c303",
 ex:"R은 시각화·통계에 강하지만 대용량 메모리 처리에 취약하고 웹 연동이 불편하다."},
{id:"q3006", s:3, c:"3-2-1", ty:"mc", q:"회귀분석의 기본 가정이 아닌 것은?", ch:["잔차의 정규성","잔차의 등분산성","잔차의 독립성","독립변수 간 강한 상관(다중공선성) 존재"], a:3, lk:"c304",
 ex:"오히려 다중공선성이 '없어야' 한다. 가정: 선형성·독립성·등분산성·정규성·비다중공선성."},
{id:"q3007", s:3, c:"3-2-1", ty:"mc", q:"회귀 계수 일부를 정확히 0으로 만들어 변수 선택 효과를 내는 규제는?", ch:["L1 규제(라쏘)","L2 규제(릿지)","드롭아웃","배치 정규화"], a:0, lk:"c305",
 ex:"L1(라쏘)은 계수를 0으로 만들어 희소 모델을 만든다. L2(릿지)는 0 근처로 축소만 한다."},
{id:"q3008", s:3, c:"3-2-1", ty:"mc", q:"로지스틱 회귀분석에 대한 설명으로 옳지 않은 것은?", ch:["종속변수가 이항형일 때 사용한다","시그모이드 함수로 확률을 0~1로 출력한다","계수를 최소제곱법(OLS)으로 추정한다","exp(계수)는 오즈비를 의미한다"], a:2, lk:"c306",
 ex:"로지스틱 회귀는 최대우도추정(MLE)으로 계수를 구한다. OLS는 선형회귀의 방법."},
{id:"q3009", s:3, c:"3-2-1", ty:"mc", q:"의사결정나무에서 '부모마디보다 자식마디의 순수도가 증가하도록' 분리하는 것을 무엇이라 하는가?", ch:["가지치기","정보 획득(획득량 최대화)","배깅","드롭아웃"], a:1, lk:"c307",
 ex:"불순도(엔트로피·지니) 감소량 = 정보 획득. 이를 최대로 하는 분리를 선택한다. 가지치기는 과적합 방지 단계."},
{id:"q3010", s:3, c:"3-2-1", ty:"mc", q:"CART 알고리즘의 분리 기준과 분리 방식으로 옳은 것은?", ch:["엔트로피 / 다지 분리","지니 지수 / 이진 분리","카이제곱 / 다지 분리","분산 / 다지 분리"], a:1, lk:"c307",
 ex:"CART는 분류 시 지니 지수, 회귀 시 분산 감소를 쓰며 항상 이진(2진) 분리를 한다. CHAID는 카이제곱·다지 분리."},
{id:"q3011", s:3, c:"3-2-2", ty:"mc", q:"배깅(Bagging)의 주된 효과는?", ch:["편향 감소","분산 감소","특성 수 감소","학습 속도 향상"], a:1, lk:"c308",
 ex:"배깅은 부트스트랩 표본으로 독립 모델을 병렬 학습해 평균/투표 → 분산 감소. 부스팅은 순차 학습 → 편향 감소."},
{id:"q3012", s:3, c:"3-2-2", ty:"ox", q:"부스팅은 약한 학습기를 순차적으로 학습시키므로 배깅에 비해 병렬 처리가 어렵다.", ch:["O","X"], a:0, lk:"c310",
 ex:"부스팅은 이전 모델 결과에 의존해 다음 모델을 학습하므로 본질적으로 순차적이라 병렬화가 어렵다."},
{id:"q3013", s:3, c:"3-2-2", ty:"mc", q:"랜덤 포레스트가 개별 의사결정나무보다 분산을 더 줄이는 핵심 장치는?", ch:["가지치기를 생략한다","각 노드에서 무작위로 선택한 일부 변수만 후보로 사용한다","모든 나무가 같은 데이터를 학습한다","깊이를 1로 제한한다"], a:1, lk:"c309",
 ex:"부트스트랩 샘플링 + 노드별 변수 부분집합(√p 등)으로 나무 간 상관을 낮춰 분산을 추가로 줄인다."},
{id:"q3014", s:3, c:"3-2-1", ty:"mc", q:"단층 퍼셉트론이 해결하지 못하는 대표적 문제는?", ch:["AND 연산","OR 연산","XOR 연산","NOT 연산"], a:2, lk:"c311",
 ex:"XOR는 선형 분리가 불가능해 단층 퍼셉트론으로 못 푼다. 은닉층 + 비선형 활성함수를 가진 MLP로 해결."},
{id:"q3015", s:3, c:"3-2-1", ty:"mc", q:"출력층의 오차를 입력층 방향으로 전파하며 연쇄법칙으로 기울기를 계산하는 알고리즘은?", ch:["순전파","경사 상승법","오차역전파","드롭아웃"], a:2, lk:"c312",
 ex:"역전파는 한 번의 순전파+역전파로 모든 가중치의 기울기를 효율적으로 구한다."},
{id:"q3016", s:3, c:"3-1-2", ty:"mc", q:"모멘텀과 AdaGrad(RMSProp)의 장점을 결합한 옵티마이저는?", ch:["SGD","Adam","NAG","배치 GD"], a:1, lk:"c313",
 ex:"Adam은 1차 모멘트(모멘텀)와 2차 모멘트(RMSProp)를 함께 사용해 좌우 흔들림이 적다."},
{id:"q3017", s:3, c:"3-2-1", ty:"mc", q:"활성함수 ReLU의 동작으로 옳은 것은?", ch:["입력을 0~1로 압축한다","0 이하는 0, 0 초과는 입력을 그대로 출력한다","−1~1로 압축한다","합이 1인 확률 벡터를 출력한다"], a:1, lk:"c314",
 ex:"ReLU는 f(x)=max(0,x). 양수 구간 기울기가 1이라 기울기 소실을 완화해 은닉층 기본 활성함수로 쓰인다."},
{id:"q3018", s:3, c:"3-2-1", ty:"ox", q:"시그모이드 함수는 입력이 매우 크거나 작을 때 기울기가 0에 가까워져 층이 깊으면 기울기 소실을 일으킨다.", ch:["O","X"], a:0, lk:"c314",
 ex:"시그모이드는 양 끝에서 포화되어 미분값이 0에 수렴한다. 이것이 여러 층에 곱해지며 기울기 소실을 유발."},
{id:"q3019", s:3, c:"4-1-2", ty:"mc", q:"신경망에서 은닉 뉴런을 학습 시 확률적으로 제거하고 테스트 시 전체를 사용하는 과적합 방지 기법은?", ch:["가중치 감소","드롭아웃","조기 종료","데이터 증강"], a:1, lk:"c315",
 ex:"드롭아웃은 특정 뉴런 의존을 막고 앙상블 효과를 낸다. 테스트 시엔 전체 뉴런을 쓰되 스케일을 보정한다."},
{id:"q3020", s:3, c:"3-2-1", ty:"mc", q:"입력 크기 7, 필터 크기 3, 패딩 1, 스트라이드 2일 때 CNN 출력의 한 변 크기는?", ch:["3","4","5","7"], a:1, lk:"c316",
 ex:"O = (I + 2P − F)/S + 1 = (7 + 2 − 3)/2 + 1 = 3 + 1 = 4."},
{id:"q3021", s:3, c:"3-2-1", ty:"ox", q:"풀링(pooling) 계층은 학습되는 가중치가 없으며 특징지도의 공간 크기를 줄인다.", ch:["O","X"], a:0, lk:"c316",
 ex:"최대/평균 풀링은 파라미터가 없고 다운샘플링으로 위치 변화에 강건함을 부여한다."},
{id:"q3022", s:3, c:"3-2-1", ty:"mc", q:"RNN이 긴 시퀀스에서 겪는 문제를 게이트와 셀 상태로 보완한 모델은?", ch:["CNN","LSTM","오토인코더","SVM"], a:1, lk:"c317",
 ex:"LSTM은 입력·망각·출력 게이트와 셀 상태로 장기 의존성(기울기 소실) 문제를 완화한다. GRU는 이를 간소화."},
{id:"q3023", s:3, c:"3-2-1", ty:"mc", q:"생성자와 판별자가 서로 경쟁하며 학습하는 딥러닝 모델은?", ch:["오토인코더","GAN","DBN","RNN"], a:1, lk:"c318",
 ex:"GAN은 가짜를 만드는 생성자와 진위를 가리는 판별자가 적대적으로 학습한다."},
{id:"q3024", s:3, c:"3-2-1", ty:"mc", q:"SVM에서 결정 경계에 가장 가까이 위치해 초평면을 결정하는 데이터 포인트를 무엇이라 하는가?", ch:["마진","서포트 벡터","커널","슬랙 변수"], a:1, lk:"c319",
 ex:"서포트 벡터가 마진 경계 위의 점들이며, 이 점들만으로 최대 마진 초평면이 정해진다."},
{id:"q3025", s:3, c:"3-2-1", ty:"mc", q:"고차원으로 실제 매핑하지 않고 내적만 계산해 비선형 분류를 가능하게 하는 SVM의 기법은?", ch:["가지치기","커널 트릭","부트스트래핑","드롭아웃"], a:1, lk:"c319",
 ex:"커널 트릭은 RBF·다항 커널 등으로 고차원 특징공간의 내적을 직접 계산해 비선형 분리를 수행한다."},
{id:"q3026", s:3, c:"3-2-1", ty:"mc", q:"연관규칙 A→B의 향상도(lift)가 1이라면?", ch:["A와 B는 서로 독립이다","A가 B를 강하게 유발한다","규칙이 무의미해 제거해야 한다","지지도가 100%이다"], a:0, lk:"c321",
 ex:"lift = P(A∩B)/(P(A)P(B)). 1이면 독립, >1이면 양의 연관, <1이면 음의 연관."},
{id:"q3027", s:3, c:"3-2-1", ty:"mc", q:"'빈발항목집합의 모든 부분집합도 빈발하다'는 성질을 이용해 후보를 가지치기하는 알고리즘은?", ch:["Apriori","K-means","Naive Bayes","PageRank"], a:0, lk:"c321",
 ex:"Apriori는 최소 지지도 미만인 항목집합을 조기에 제거해 탐색 공간을 줄인다. FP-Growth는 후보 생성 없이 더 빠르다."},
{id:"q3028", s:3, c:"3-2-1", ty:"mc", q:"K-평균 군집분석의 특징으로 옳지 않은 것은?", ch:["군집 수 k를 미리 지정해야 한다","초기 중심값에 따라 결과가 달라질 수 있다","덴드로그램으로 군집 수를 사후에 정한다","이상치에 민감하다"], a:2, lk:"c322",
 ex:"덴드로그램은 계층적 군집의 산출물이다. K-means는 비계층적이며 k를 미리 정한다."},
{id:"q3029", s:3, c:"3-2-1", ty:"mc", q:"계층적 군집에서 두 군집 병합 시 '군집 내 오차제곱합의 증가가 최소'가 되도록 하는 연결법은?", ch:["최단 연결법","최장 연결법","평균 연결법","Ward 연결법"], a:3, lk:"c323",
 ex:"Ward 연결법은 병합 시 분산(SSE) 증가를 최소화해 크기가 비슷한 조밀 군집을 만든다."},
{id:"q3030", s:3, c:"3-2-1", ty:"mc", q:"민코프스키 거리에서 m=1일 때 얻어지는 거리는?", ch:["유클리드 거리","맨해튼 거리","마할라노비스 거리","코사인 거리"], a:1, lk:"c325",
 ex:"민코프스키 거리는 m=1이면 맨해튼, m=2이면 유클리드가 된다."},
{id:"q3031", s:3, c:"3-2-1", ty:"mc", q:"변수 간 상관관계(공분산)를 고려해 '평균에서 얼마나 떨어져 있는지'를 재는 거리 척도는?", ch:["유클리드 거리","맨해튼 거리","마할라노비스 거리","자카드 거리"], a:2, lk:"c325",
 ex:"마할라노비스 거리는 공분산 역행렬을 사용해 변수 간 상관·척도를 반영하므로 척도 불변이다."},
{id:"q3032", s:3, c:"3-2-2", ty:"mc", q:"시계열이 정상성(stationarity)을 갖는다는 것의 의미가 아닌 것은?", ch:["모든 시점에서 평균이 일정","모든 시점에서 분산이 일정","자기공분산이 시차(lag)에만 의존","시간이 지날수록 값이 계속 증가하는 추세 보유"], a:3, lk:"c326",
 ex:"추세가 있으면 비정상이다. 정상 시계열은 평균·분산이 일정하고 공분산이 시차에만 의존하며 차분으로 정상화한다."},
{id:"q3033", s:3, c:"3-2-2", ty:"mc", q:"관찰 기간 제한 없이 모든 과거 데이터를 사용하되 최근 값에 더 큰 가중치를 지수적으로 부여하는 방법은?", ch:["이동평균법","지수평활법","분해법","자기회귀모형"], a:1, lk:"c327",
 ex:"지수평활법은 가중치가 과거로 갈수록 지수적으로 감소한다. 이동평균법은 최근 n기간만 균등 평균."},
{id:"q3034", s:3, c:"3-2-2", ty:"mc", q:"비정상 시계열을 d번 차분해 정상화한 뒤 AR·MA를 적용하는 모형은?", ch:["ARMA","ARIMA","지수평활","VAR"], a:1, lk:"c327",
 ex:"ARIMA(p,d,q)의 I(Integrated)가 차분 횟수 d를 의미한다. ARMA는 정상 시계열용."},
{id:"q3035", s:3, c:"3-2-2", ty:"mc", q:"독립된 3개 이상 집단의 중앙값 차이를 검정하는 비모수 방법은?", ch:["만-휘트니 U 검정","크루스칼-왈리스 검정","윌콕슨 부호순위 검정","대응표본 t 검정"], a:1, lk:"c328",
 ex:"크루스칼-왈리스 = 일원분산분석의 비모수 대응. 독립 2집단은 만-휘트니, 대응 2집단은 윌콕슨 부호순위."},
{id:"q3036", s:3, c:"3-1-1", ty:"ox", q:"종속변수가 없는 분석에서는 사용할 수 있는 알고리즘이 군집·연관규칙·이상치 탐지·요인분석 등으로 제한된다.", ch:["O","X"], a:0, lk:"c329",
 ex:"종속변수(정답)가 없으면 비지도학습만 가능하다."},

/* ===== 과목 4 ===== */
{id:"q4001", s:4, c:"4-1-1", ty:"mc", q:"정밀도(Precision)의 계산식으로 옳은 것은?", ch:["TP / (TP + FN)","TP / (TP + FP)","(TP + TN) / 전체","TN / (TN + FP)"], a:1, lk:"c401",
 ex:"정밀도 = TP/(TP+FP), 양성 예측 중 실제 양성 비율. 재현율 = TP/(TP+FN)."},
{id:"q4002", s:4, c:"4-1-1", ty:"mc", q:"암 진단처럼 '실제 양성을 놓치면 안 되는' 경우 중요하게 봐야 할 지표는?", ch:["정밀도","재현율(민감도)","특이도","정확도"], a:1, lk:"c401",
 ex:"재현율은 실제 양성 중 잡아낸 비율. FN(놓침)을 줄이는 것이 목표일 때 중요하다."},
{id:"q4003", s:4, c:"4-1-1", ty:"mc", q:"정밀도와 재현율의 조화평균으로 계산되는 지표는?", ch:["정확도","F1 score","AUC","R²"], a:1, lk:"c401",
 ex:"F1 = 2·P·R/(P+R). 클래스 불균형 상황에서 대표적으로 쓰는 지표."},
{id:"q4004", s:4, c:"4-1-1", ty:"mc", q:"ROC 곡선의 x축과 y축은 각각 무엇인가?", ch:["정밀도 / 재현율","FPR(1−특이도) / TPR(재현율)","임계값 / 정확도","FN / FP"], a:1, lk:"c402",
 ex:"ROC는 x=거짓양성률(1−특이도), y=참양성률(재현율). AUC가 1에 가까울수록 좋고 0.5는 무작위."},
{id:"q4005", s:4, c:"4-1-1", ty:"ox", q:"양성 클래스가 매우 희귀한 불균형 데이터에서는 ROC 곡선보다 정밀도-재현율(PR) 곡선이 모델 성능 차이를 더 잘 드러낸다.", ch:["O","X"], a:0, lk:"c402",
 ex:"불균형이 심하면 FPR이 잘 변하지 않아 ROC-AUC가 낙관적으로 나온다. PR 곡선이 더 민감하다."},
{id:"q4006", s:4, c:"4-1-1", ty:"mc", q:"MSE에 제곱근을 취해 원 데이터와 단위를 맞춘 회귀 평가지표는?", ch:["SSE","RMSE","MAE","MAPE"], a:1, lk:"c403",
 ex:"SSE→(÷n)→MSE→(√)→RMSE. MAE는 절대오차 평균, MAPE는 백분율 오차."},
{id:"q4007", s:4, c:"4-1-1", ty:"mc", q:"독립변수를 추가할 때 무조건 값이 커지는 문제를 보정해, 변수 수가 다른 회귀모형을 비교할 때 쓰는 지표는?", ch:["결정계수 R²","수정된 결정계수(Adjusted R²)","SSE","상관계수"], a:1, lk:"c403",
 ex:"R²는 변수 추가 시 항상 증가하므로, 변수 개수를 페널티로 반영한 수정 R²나 AIC/BIC로 비교해야 한다."},
{id:"q4008", s:4, c:"4-1-1", ty:"ox", q:"AIC는 값이 낮을수록 모형의 적합도가 높다고 본다.", ch:["O","X"], a:0, lk:"c404",
 ex:"AIC = −2ln(L) + 2k. 적합도와 복잡도의 균형을 재며 값이 작을수록 좋은 모형이다. BIC는 표본 크기를 페널티에 반영."},
{id:"q4009", s:4, c:"4-1-1", ty:"mc", q:"실루엣 계수 s(i)에서 a(i)와 b(i)는 각각 무엇인가?", ch:["a=군집 간 분리도, b=군집 내 응집도","a=군집 내 응집도, b=최근접 타 군집과의 분리도","a=정밀도, b=재현율","a=편향, b=분산"], a:1, lk:"c405",
 ex:"s(i) = (b−a)/max(a,b). a는 같은 군집 내 평균 거리(작을수록 좋음), b는 가장 가까운 다른 군집과의 평균 거리(클수록 좋음). 1에 가까울수록 좋다."},
{id:"q4010", s:4, c:"4-1-1", ty:"mc", q:"데이터를 k등분해 각 부분을 한 번씩 검증셋으로 쓰고 나머지로 학습하는 것을 k번 반복하는 검증법은?", ch:["홀드아웃","k-fold 교차검증","부트스트랩","계통추출"], a:1, lk:"c406",
 ex:"k-fold는 모든 데이터가 검증에 한 번씩 쓰여 성능 추정의 분산을 줄인다. k=n이면 LOOCV."},
{id:"q4011", s:4, c:"4-1-1", ty:"mc", q:"관측된 표본의 누적분포와 이론적 분포의 최대 차이를 이용하며 연속형 데이터에도 적용 가능한 적합도 검정은?", ch:["카이제곱 검정","콜모고로프-스미르노프 검정","더빈-왓슨 검정","F 검정"], a:1, lk:"c407",
 ex:"K-S 검정은 누적분포함수(CDF)의 최대 거리(D 통계량)로 적합도를 본다. 카이제곱 적합도는 범주형 빈도 기반."},
{id:"q4012", s:4, c:"4-1-1", ty:"mc", q:"회귀 잔차의 독립성(자기상관 여부)을 진단하는 통계량은?", ch:["VIF","더빈-왓슨","샤피로-윌크","실루엣 계수"], a:1, lk:"c407",
 ex:"더빈-왓슨 통계량이 2 근처면 자기상관 없음, 0에 가까우면 양의 자기상관. VIF는 다중공선성 진단."},
{id:"q4013", s:4, c:"4-1-2", ty:"mc", q:"하이퍼파라미터 탐색에서 후보값의 모든 조합을 전수 탐색하는 방법은?", ch:["그리드 서치","랜덤 서치","베이지안 최적화","경사하강법"], a:0, lk:"c408",
 ex:"그리드 서치는 격자의 모든 조합을 시도한다. 랜덤 서치는 무작위 샘플링, 베이지안 최적화는 이전 결과로 유망 지점을 우선 탐색."},
{id:"q4014", s:4, c:"4-1-2", ty:"ox", q:"학습률(learning rate)은 사람이 설정하는 하이퍼파라미터이고, 신경망의 가중치는 학습으로 결정되는 파라미터다.", ch:["O","X"], a:0, lk:"c408",
 ex:"파라미터(가중치·계수)는 데이터로 학습, 하이퍼파라미터(학습률·트리 깊이·k·λ)는 사람이 지정한다."},
{id:"q4015", s:4, c:"4-1-2", ty:"mc", q:"'1 이터레이션(iteration)'의 의미로 옳은 것은?", ch:["전체 데이터를 1번 학습","미니배치 1개를 학습해 매개변수를 1회 갱신","에폭 수를 1 늘림","은닉층을 1개 추가"], a:1, lk:"c409",
 ex:"1 iteration = 미니배치 1개 처리 = 파라미터 1회 업데이트. 1 epoch = (전체 수 / 배치 크기) iteration."},
{id:"q4016", s:4, c:"4-1-2", ty:"mc", q:"운영 중인 분석 모형에 대해 환경·데이터 변화를 반영하여 데이터 품질 점검, 알고리즘 개선, 매개변수 재최적화를 수행하는 것은?", ch:["모니터링","리모델링","프로파일링","샘플링"], a:1, lk:"c410",
 ex:"모니터링은 성능 유지 여부를 관찰하는 것, 리모델링은 변화를 수용하기 위해 재학습·재튜닝하는 것."},
{id:"q4017", s:4, c:"4-2-1", ty:"mc", q:"연관분석 결과를 시각화할 때 가장 적합한 방법은?", ch:["트리 다이어그램","네트워크 그래프","산점도와 회귀선","막대그래프"], a:1, lk:"c411",
 ex:"연관분석은 항목 간 관계를 네트워크 그래프로 표현한다. 의사결정나무는 트리 다이어그램, 회귀는 산점도·히트맵."},
{id:"q4018", s:4, c:"4-2-2", ty:"mc", q:"지역·장소에 따른 데이터 분포를 색상 농도로 표현하는 공간 시각화 방법은?", ch:["히스토그램","단계구분도(코로플레스)","스타차트","박스플롯"], a:1, lk:"c412",
 ex:"단계구분도는 행정구역 등을 값에 따라 색으로 구분한다. 카토그램은 면적 자체를 값에 비례해 왜곡."},
{id:"q4019", s:4, c:"4-2-2", ty:"mc", q:"전체를 구성하는 비율(합이 100%)을 나타내는 데 적합한 분포 시각화가 아닌 것은?", ch:["파이차트","도넛차트","트리맵","산점도"], a:3, lk:"c412",
 ex:"산점도는 두 변수의 관계(관계 시각화)를 본다. 분포 시각화는 히스토그램·파이·도넛·트리맵·누적영역차트."},
{id:"q4020", s:4, c:"4-2-2", ty:"mc", q:"여러 변수를 축으로 하는 다각형 형태로 대상을 비교하는 차트는?", ch:["스타(레이더)차트","꺾은선그래프","버블차트","단계구분도"], a:0, lk:"c412",
 ex:"스타차트·평행좌표계·체르노프 페이스는 비교 시각화. 시간=꺾은선, 관계=버블·산점도, 공간=단계구분도."},
{id:"q4021", s:4, c:"4-2-2", ty:"ox", q:"Tufte의 데이터-잉크 비율은 낮을수록 좋은 시각화다.", ch:["O","X"], a:1, lk:"c413",
 ex:"데이터-잉크 비율은 '높일수록' 좋다. 데이터를 나타내지 않는 불필요한 장식(차트정크)을 줄여야 한다."},
{id:"q4022", s:4, c:"4-2-3", ty:"mc", q:"CRISP-DM과 빅데이터 분석 방법론 참조모델에서 공통적으로 마지막에 오는 단계는?", ch:["모델링","데이터 준비","전개(Deployment)","업무 이해"], a:2, lk:"c414",
 ex:"전개 단계에서 개발된 모델을 실제 업무·시스템에 적용하고 지속 관리 방안을 마련한다."},

/* ===== 과목 1 추가 ===== */
{id:"q1023", s:1, c:"1-1-1", ty:"mc", q:"섭씨온도(℃)는 어떤 측정 척도에 해당하는가?", ch:["명목척도","순서척도","구간척도","비율척도"], a:2, lk:"c102",
 ex:"섭씨온도는 간격이 일정하지만 0℃가 '온도 없음'을 뜻하지 않아 절대 영점이 없다 → 구간척도. 절대 영점이 있는 켈빈온도·키·무게는 비율척도."},
{id:"q1024", s:1, c:"1-1-1", ty:"mc", q:"DIKW 계층에서 '왜(why)'에 대응하며 가치 판단·통찰이 더해진 단계는?", ch:["데이터","정보","지식","지혜"], a:3, lk:"c101",
 ex:"지혜(Wisdom)는 지식에 상황 판단과 통찰을 더해 새로운 상황에 적용하는 능력으로, '왜'에 답한다. 지식은 '어떻게(how)'."},
{id:"q1025", s:1, c:"1-1-1", ty:"mc", q:"전사 DW를 먼저 구축한 뒤 데이터 마트를 파생시키는 하향식 DW 구축 관점은?", ch:["Kimball 방식","Inmon 방식","Codd 방식","Boyce 방식"], a:1, lk:"c105",
 ex:"Inmon은 하향식(전사 DW→데이터 마트), Kimball은 상향식(데이터 마트→통합 DW). Inmon은 정합성이 높고 초기 비용·기간이 크다."},
{id:"q1026", s:1, c:"1-1-2", ty:"mc", q:"HDFS에서 파일의 메타데이터(디렉터리 구조, 블록 위치)를 관리하는 노드는?", ch:["DataNode","NameNode","ResourceManager","JournalNode"], a:1, lk:"c107",
 ex:"NameNode가 메타데이터를, DataNode가 실제 데이터 블록을 저장한다. 기본 블록 크기 128MB, 기본 복제 계수 3."},
{id:"q1027", s:1, c:"1-1-2", ty:"ox", q:"MapReduce의 처리 순서는 Map → Reduce → Shuffle이다.", ch:["O","X"], a:1, lk:"c109",
 ex:"올바른 순서는 (Split →) Map → Shuffle & Sort → Reduce → Output. Shuffle은 Map과 Reduce 사이에서 동일 key를 모으는 단계이며 네트워크 병목이다."},
{id:"q1028", s:1, c:"1-3-2", ty:"mc", q:"원천 데이터를 가공하지 않고 원본 형태로 저장하며 읽는 시점에 구조를 부여(schema-on-read)하는 저장소는?", ch:["데이터 웨어하우스","데이터 마트","데이터 레이크","ODS"], a:2, lk:"c105",
 ex:"데이터 레이크는 정형·비정형을 원본 그대로 저장하고 읽을 때 스키마를 적용한다. DW는 적재 전에 정제·구조화(schema-on-write)한다."},
{id:"q1029", s:1, c:"1-2-1", ty:"mc", q:"KDD 방법론의 5단계에 포함되지 않는 것은?", ch:["데이터셋 선택","전처리","업무 이해","데이터 마이닝"], a:2, lk:"c113",
 ex:"KDD = 데이터셋 선택 → 전처리 → 변환 → 데이터 마이닝 → 해석·평가. '업무 이해'는 CRISP-DM에만 있다."},
{id:"q1030", s:1, c:"1-2-1", ty:"mc", q:"분석 준비도는 높지만 분석 성숙도는 낮은 조직 유형은?", ch:["준비형","정착형","도입형","확산형"], a:2, lk:"c116",
 ex:"준비도↑·성숙도↓ = 도입형(바로 도입 가능). 준비도↓·성숙도↑ = 정착형. 둘 다 높으면 확산형, 둘 다 낮으면 준비형."},
{id:"q1031", s:1, c:"1-2-1", ty:"mc", q:"데이터 거버넌스의 3대 구성요소로 옳은 것은?", ch:["원칙 · 조직 · 프로세스","수집 · 저장 · 분석","가용성 · 무결성 · 기밀성","사람 · 기술 · 데이터"], a:0, lk:"c115",
 ex:"거버넌스 구성요소 = 원칙(Principle)·조직(Organization)·프로세스(Process). 확보하려는 데이터 속성은 가용성·유용성·통합성·보안성·안전성."},
{id:"q1032", s:1, c:"1-1-2", ty:"mc", q:"배치 레이어와 스피드 레이어를 병행 운영해 정확성과 저지연을 모두 얻는 실시간 처리 아키텍처는?", ch:["람다(Lambda) 아키텍처","카파(Kappa) 아키텍처","MVC 아키텍처","3계층 아키텍처"], a:0, lk:"c122",

/* ---- 링(SVG 원형 진행) ---- */
function ring(pct, size, stroke, color){
  const r = (size-stroke)/2, c = 2*Math.PI*r, off = c*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(128,128,128,.22)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
  </svg>`;
}

let openSubj = 1;

function openChapter(chId){
  const cs = deckFor(S.mode).filter(c=>c.c===chId);
  const target = (cs.find(c=>!S.studied[c.id]) || cs[0] || CONCEPTS.find(c=>c.c===chId));

/* ===================== 탭2 · 개념 학습 ===================== */
function deckFor(mode){
  let d = CONCEPTS;
  if(mode==="unseen") d = CONCEPTS.filter(c=>!S.studied[c.id]);
  if(mode==="bookmark") d = CONCEPTS.filter(c=>S.bookmarks[c.id]);
  return d.length ? d : CONCEPTS;
}
let curConcept = null;

function openConcept(id){
  curConcept = id;
  S.last = id; save();
  setTab("learn");
}

function renderLearn(){
  const v=$("#view-learn"); v.innerHTML="";
  if(!curConcept) curConcept = (deckFor(S.mode)[0]||CONCEPTS[0]).id;
  const deck = deckFor(S.mode);
  let idx = deck.findIndex(c=>c.id===curConcept);
  let C;
  if(idx<0){ C = CONCEPTS.find(c=>c.id===curConcept); }
  else C = deck[idx];
  if(!C){ C = CONCEPTS[0]; curConcept=C.id; idx=deck.findIndex(c=>c.id===C.id); }

  const wrap=el("div","concept-wrap");

  // breadcrumb
  const cb=el("div","crumbs");
  cb.innerHTML=`<span>${esc(SUBJ_BY_ID[C.s].t)}</span><span class="sep">›</span>
    <span>${esc(CH_TITLE[C.c]||C.c)}</span><span class="sep">›</span>
    <span class="cur">${(idx>=0?idx+1:'–')}/${deck.length}</span>`;
  wrap.appendChild(cb);

  wrap.appendChild(el("h1","concept-h", esc(C.t)));

  const tags=el("div","tagrow");
  (C.tag||[]).forEach(t=>tags.appendChild(el("span","tag"+(t==="빈출"?" k":""), esc(t))));

  const art=el("div","article");

  // 하단
  const foot=el("div","concept-foot");

  const markRow=el("div","mark-row");
  const done=!!S.studied[C.id], bmk=!!S.bookmarks[C.id];
  const dBtn=el("button","mark-btn"+(done?" done":""), `${IC.check}${done?"이해함":"이해함 표시"}`);
  dBtn.addEventListener("click",()=>{
    if(S.studied[C.id]) delete S.studied[C.id]; else S.studied[C.id]=1;

    toast(S.studied[C.id]?"이해한 개념으로 표시":"표시 해제");
  });

  bBtn.addEventListener("click",()=>{
    if(S.bookmarks[C.id]) delete S.bookmarks[C.id]; else S.bookmarks[C.id]=1;
    save(); renderLearn();
  });
  markRow.append(dBtn,bBtn);
  foot.appendChild(markRow);

  const navRow=el("div","nav-row");
  const prev = idx>0 ? deck[idx-1] : null;
  const next = idx>=0 && idx<deck.length-1 ? deck[idx+1] : null;
  const pB=el("button","nav-btn prev");

  pB.disabled=!prev; if(prev) pB.addEventListener("click",()=>{ curConcept=prev.id; S.last=prev.id; save(); renderLearn(); window.scrollTo(0,0); });

function renderBlock(bl){
  const t=bl[0];
  if(t==="p") return el("p",null, md(bl[1]));
  if(t==="h") return el("h4",null, esc(bl[1]));
  if(t==="ul"){
    const u=el("ul"); (bl[1]||[]).forEach(li=>u.appendChild(el("li",null, md(li)))); return u;
  }
  if(t==="steps"){
    const d=el("div","steps");
    d.appendChild(el("div","st-t", `${IC.gear}<span>${esc(bl[1])}</span>`));
    const ol=el("ol"); (bl[2]||[]).forEach(s=>ol.appendChild(el("li",null, md(s)))); d.appendChild(ol);
    return d;
  }
  if(t==="table"){
    const w=el("div","tablewrap"); const tb=el("table","cmp");
    const heads=bl[1]||[], rows=bl[2]||[];
    let html="<thead><tr>"+heads.map(h=>`<th>${md(h)}</th>`).join("")+"</tr></thead><tbody>";
    rows.forEach(r=>{
      html+="<tr>"+r.map((cell,i)=> i===0 && heads[0]==="" ? `<th>${md(cell)}</th>` : `<td>${md(cell)}</td>`).join("")+"</tr>";
    });
    html+="</tbody>"; tb.innerHTML=html; w.appendChild(tb); return w;
  }
  if(t==="formula"){
    const d=el("div","formula");
    d.appendChild(el("span","fx", esc(bl[1])));
    if(bl[2]) d.appendChild(el("span","fd", md(bl[2])));
    return d;
  }
  if(t==="why"){
    const d=el("div","why");
    d.appendChild(el("div","w-t", `${IC.spark}실무·심화 연결`));
    d.appendChild(el("p",null, md(bl[1])));
    return d;
  }
  if(t==="exam"){
    const d=el("div","exam");
    d.appendChild(el("div","e-t", `${IC.target}시험 포인트`));
    const u=el("ul"); (bl[1]||[]).forEach(li=>u.appendChild(el("li",null, md(li)))); d.appendChild(u);
    return d;
  }
  return el("p",null, md(JSON.stringify(bl)));
}

/* ===================== 탭3 · 문제 풀이 ===================== */
let quizScope = {type:"all", count:10};

function renderQuizHub(){
  const v=$("#view-quiz"); v.innerHTML="";
  const setup=el("div","quiz-setup");
  setup.appendChild(el("h2",null,"문제 풀이"));
  setup.appendChild(el("p","sub", `총 ${TOTAL_Q}문항 · 4지선다와 O/X · 풀이 해설 포함`));

  g.innerHTML=`
    <div class="qs"><b>${S.quiz.total}</b><span>푼 문제</span></div>

  setup.appendChild(g);

  setup.appendChild(el("div","section-label","범위 선택"));
  const scope=el("div","q-scope");
  const mk=(cfg,ic,title,desc,n,dis)=>{
    const b=el("button","scope-btn"+(sameScope(cfg)?" on":"")+(dis?" dis":""));
    b.innerHTML=`<span class="sc-ic">${ic}</span><span class="sc-m"><b>${esc(title)}</b><span>${esc(desc)}</span></span><span class="sc-n">${n}</span>`;
    if(!dis) b.addEventListener("click",()=>{ quizScope=Object.assign({count:quizScope.count},cfg); renderQuizHub(); });
    return b;
  };
  scope.appendChild(mk({type:"all"}, IC.book, "전체 랜덤", "4과목 전 범위에서 무작위 출제", TOTAL_Q));
  SUBJECTS.forEach(sub=>{
    const n=QUESTIONS.filter(q=>q.s===sub.id).length;
    scope.appendChild(mk({type:"subj",id:sub.id}, `<b style="font-family:var(--mono);font-weight:600">${sub.id}</b>`,
      `${sub.id}과목 · ${sub.t}`, `${n}문항`, n));
  });
  const wn=wrongCount();
  scope.appendChild(mk({type:"wrong"}, IC.redo, "오답만 다시 풀기", wn? "틀렸던 문제를 복습" : "틀린 문제가 없습니다", wn, wn===0));
  setup.appendChild(scope);

  setup.appendChild(el("div","section-label","문항 수"));
  const cs=el("div","modes");
  [10,20,"전체"].forEach(n=>{
    const val = n==="전체"? 999 : n;
    const c=el("button","chip"+(quizScope.count===val?" on":""), esc(String(n)));
    c.addEventListener("click",()=>{ quizScope.count=val; renderQuizHub(); });
    cs.appendChild(c);
  });
  setup.appendChild(cs);

  const avail = poolFor(quizScope).length;
  const start=el("button","q-start", `${IC.play} ${Math.min(avail,quizScope.count)}문항 시작`);
  start.disabled = avail===0;
  start.addEventListener("click",()=>startQuiz(quizScope));
  setup.appendChild(start);

  v.appendChild(setup);
}
function sameScope(cfg){
  if(cfg.type!==quizScope.type) return false;
  if(cfg.type==="subj") return cfg.id===quizScope.id;
  return true;
}
function poolFor(scope){
  if(scope.type==="all") return QUESTIONS.slice();
  if(scope.type==="subj") return QUESTIONS.filter(q=>q.s===scope.id);
  if(scope.type==="chapter") return QUESTIONS.filter(q=>q.c===scope.id);
  if(scope.type==="wrong") return QUESTIONS.filter(q=>S.quiz.wrong[q.id]);
  return QUESTIONS.slice();
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

let run=null;
function startQuiz(scope){
  let pool = shuffle(poolFor(scope));
  const cnt = scope.count || quizScope.count || 10;
  if(scope.type!=="wrong") pool = pool.slice(0, Math.min(cnt, pool.length));
  if(!pool.length){ toast("출제할 문제가 없습니다"); return; }
  run={ list:pool, i:0, correct:0, answered:false, sessionWrong:[] };
  setTab("quiz");
  renderRun();
}

function renderRun(){
  const v=$("#view-quiz"); v.innerHTML="";
  const q=run.list[run.i];
  const box=el("div","q-run");

  const top=el("div","q-topbar");
  const close=el("button","qclose",IC.x);
  close.addEventListener("click",()=>{ if(confirm("문제 풀이를 종료할까요? 지금까지 기록은 저장됩니다.")){ run=null; renderQuizHub(); } });
  const prog=el("div","q-prog",`<i style="width:${run.i/run.list.length*100}%"></i>`);
  top.append(close,prog,el("span","q-count",`${run.i+1} / ${run.list.length}`));
  box.appendChild(top);

  const card=el("div","q-card");
  const meta=el("div","q-meta");
  meta.innerHTML=`<span class="qt ${q.ty==='ox'?'ox':''}">${q.ty==='ox'?'O / X':'객관식'}</span>
    <span class="qsrc">${q.s}과목 · ${esc(CH_TITLE[q.c]||q.c)}</span>`;
  card.appendChild(meta);
  card.appendChild(el("div","q-text", md(q.q)));

  const opts=el("div","q-opts");
  q.ch.forEach((choice,i)=>{
    const b=el("button","opt"+(q.ty==='ox'?" ox":""));
    if(q.ty==='ox') b.innerHTML=esc(choice);
    else b.innerHTML=`<span class="ok-key">${String.fromCharCode(65+i)}</span><span>${md(choice)}</span>`;
    b.addEventListener("click",()=>pick(i,b,opts));
    opts.appendChild(b);
  });
  card.appendChild(opts);

  const ex=el("div","q-explain");
  card.appendChild(ex);
  box.appendChild(card);

  const nextWrap=el("div");
  box.appendChild(nextWrap);
  run._els={opts,ex,nextWrap};
  v.appendChild(box);
}

function pick(sel, btn, opts){
  if(run.answered) return;
  run.answered=true;
  const q=run.list[run.i];
  const ok = sel===q.a;
  [...opts.children].forEach((b,i)=>{
    b.disabled=true;
    if(i===q.a) b.classList.add("correct");
    if(i===sel && !ok) b.classList.add("wrong");
    if(i===sel && ok) b.classList.add("correct");
  });
  // 통계 반영
  S.quiz.total++;
  S.quiz.perSubj[q.s] = S.quiz.perSubj[q.s]||{c:0,t:0};
  S.quiz.perSubj[q.s].t++;
  if(ok){
    run.correct++; S.quiz.correct++; S.quiz.perSubj[q.s].c++;
    if(S.quiz.wrong[q.id]){ delete S.quiz.wrong[q.id]; }
  } else {
    S.quiz.wrong[q.id]=1; run.sessionWrong.push(q.id);
  }
  save(); updateBadge();

  const ex=run._els.ex;
  ex.className="q-explain show";
  ex.innerHTML=`<div class="ex-v ${ok?'o':'x'}">${ok?IC.check+' 정답':IC.x+' 오답'} · ${q.ty==='ox'? esc(q.ch[q.a]) : String.fromCharCode(65+q.a)+'번'}</div>
    <p>${md(q.ex)}</p>`;
  if(q.lk){
    const a=el("button","ex-link", `${IC.book} 관련 개념 보기`);
    a.addEventListener("click",()=>{ openConcept(q.lk); });
    ex.appendChild(a);
  }

  const last = run.i===run.list.length-1;
  const nb=el("button","q-next", last? `${IC.check} 결과 보기` : `다음 문제 ${IC.arrowR}`);
  nb.addEventListener("click",()=> last? finishRun() : nextQ());
  run._els.nextWrap.appendChild(nb);
  run._els.nextWrap.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function nextQ(){ run.i++; run.answered=false; renderRun(); window.scrollTo(0,0); }

function finishRun(){
  const v=$("#view-quiz"); v.innerHTML="";
  const n=run.list.length, c=run.correct, pct=Math.round(c/n*100);
  const wrong=n-c;
  const col = pct>=80? "var(--ok)" : pct>=50? "var(--warn)" : "var(--bad)";
  const msg = pct>=90? "완벽에 가깝습니다. 다음 과목으로!" : pct>=70? "합격권입니다. 오답만 정리하면 탄탄해요." : pct>=50? "개념 복습이 필요한 구간이 보입니다." : "관련 개념 탭을 먼저 훑고 다시 도전해 보세요.";
  const r=el("div","q-result");
  r.innerHTML=`
    <div class="rring">${ring(pct,130,11,col)}<span class="num" style="color:${col}">${pct}%</span></div>
    <h2>${c} / ${n} 정답</h2>
    <div class="rmsg">${esc(msg)}</div>
    <div class="rbreak">
      <div><b class="o">${c}</b>맞힘</div>
      <div><b class="x">${wrong}</b>틀림</div>
    </div>`;
  const acts=el("div","ractions");
  if(run.sessionWrong.length){
    const w=el("button","primary", `${IC.redo} 이번 오답 ${run.sessionWrong.length}개 다시 풀기`);
    const ids=run.sessionWrong.slice();
    w.addEventListener("click",()=>{
      const pool=QUESTIONS.filter(q=>ids.includes(q.id));
      run={list:shuffle(pool), i:0, correct:0, answered:false, sessionWrong:[]};
      renderRun(); window.scrollTo(0,0);
    });
    acts.appendChild(w);
  }
  const again=el("button", run.sessionWrong.length?"sec":"primary", `${IC.play} 새 문제 풀기`);
  again.addEventListener("click",()=>{ run=null; renderQuizHub(); });
  acts.appendChild(again);
  const home=el("button","sec", "홈으로");
  home.addEventListener("click",()=>{ run=null; setTab("home"); });
  acts.appendChild(home);
  r.appendChild(acts);
  v.appendChild(r);
  run=null;
  window.scrollTo(0,0);
}

/* ===================== 테마 / 리셋 ===================== */
function applyTheme(){
  if(S.theme==="dark"||S.theme==="light") document.documentElement.setAttribute("data-theme",S.theme);
  else document.documentElement.removeAttribute("data-theme");
}
$("#themeBtn").addEventListener("click",()=>{
  const order=[null,"light","dark"];
  S.theme = order[(order.indexOf(S.theme)+1)%3];
  save(); applyTheme();
  toast(S.theme? (S.theme==="dark"?"다크 모드":"라이트 모드") : "시스템 테마");
});
$("#resetBtn").addEventListener("click",()=>{
  if(confirm("모든 학습·문제 기록을 삭제할까요? 되돌릴 수 없습니다.")){
    S=DEF(); save(); applyTheme(); curConcept=null; run=null; openSubj=1;
    updateBadge(); setTab("home"); toast("기록을 초기화했습니다");
  }
});

/* ===================== 초기화 ===================== */
applyTheme();
updateBadge();
renderHome();
})();
</script>
