<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b5bdb">
<meta name="description" content="빅데이터분석기사 필기 심화 학습 앱 — 개념 원리·모델 비교·문제풀이">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="빅데이터분석">
<title>빅데이터분석</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ===================== 토큰 ===================== */
:root{
  --bg:#f4f6fa;
  --bg-grad:radial-gradient(1200px 600px at 100% -10%, #e9edfb 0%, rgba(233,237,251,0) 60%);
  --surface:#ffffff;
  --surface-2:#f7f9fc;
  --surface-sunk:#eef1f7;
  --line:#e2e7f0;
  --line-strong:#cbd3e2;
  --text:#1c2430;
  --text-mid:#4a5666;
  --text-dim:#7c8798;
  --accent:#3b5bdb;
  --accent-press:#2f49b3;
  --accent-soft:#e7ecfd;
  --accent-line:#c3d0fb;
  --ok:#2f9e44;
  --ok-soft:#e6f4ea;
  --bad:#e03131;
  --bad-soft:#fce8e8;
  --warn:#e8850c;
  --warn-soft:#fdefdd;
  --gold:#b0870a;
  --shadow-sm:0 1px 2px rgba(20,30,50,.06),0 1px 3px rgba(20,30,50,.05);
  --shadow-md:0 4px 14px rgba(20,30,50,.09),0 2px 6px rgba(20,30,50,.05);
  --shadow-lg:0 18px 44px rgba(20,30,50,.16);
  --r-s:9px; --r-m:14px; --r-l:20px;
  --maxw:760px;
  --tabbar-h:64px;
  --serif:"Noto Serif KR",Georgia,"Nanum Myeongjo",serif;
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f131a;
    --bg-grad:radial-gradient(1200px 600px at 100% -10%, #1a2233 0%, rgba(26,34,51,0) 60%);
    --surface:#171d27;
    --surface-2:#1c2531;
    --surface-sunk:#12171f;
    --line:#28313f;
    --line-strong:#38445699;
    --text:#e8ecf3;
    --text-mid:#aab5c5;
    --text-dim:#7a8698;
    --accent:#7d97f4;
    --accent-press:#9fb2f8;
    --accent-soft:#22304f;
    --accent-line:#33477a;
    --ok:#5bc16d; --ok-soft:#17301d;
    --bad:#f2777a; --bad-soft:#361a1c;
    --warn:#f0a44e; --warn-soft:#33260f;
    --gold:#e6c063;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 6px 18px rgba(0,0,0,.45);
    --shadow-lg:0 20px 48px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0f131a;
  --bg-grad:radial-gradient(1200px 600px at 100% -10%, #1a2233 0%, rgba(26,34,51,0) 60%);
  --surface:#171d27; --surface-2:#1c2531; --surface-sunk:#12171f;
  --line:#28313f; --line-strong:#38445699;
  --text:#e8ecf3; --text-mid:#aab5c5; --text-dim:#7a8698;
  --accent:#7d97f4; --accent-press:#9fb2f8; --accent-soft:#22304f; --accent-line:#33477a;
  --ok:#5bc16d; --ok-soft:#17301d; --bad:#f2777a; --bad-soft:#361a1c;
  --warn:#f0a44e; --warn-soft:#33260f; --gold:#e6c063;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 6px 18px rgba(0,0,0,.45);
  --shadow-lg:0 20px 48px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--bg);
  background-image:var(--bg-grad);
  background-attachment:fixed;
  color:var(--text);
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  text-size-adjust:100%;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
/* 버튼 내 인라인 아이콘이 커지지 않도록(속성 width 없는 svg만) */
#app button svg:not([width]){width:18px;height:18px;flex:none}
.tab svg:not([width]){width:22px;height:22px}

/* ===================== 레이아웃 ===================== */
#app{max-width:var(--maxw);margin:0 auto;min-height:100%;position:relative}
.view{display:none;padding:0 clamp(14px,4vw,22px);padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 26px)}
.view.active{display:block;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.apphead{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) clamp(14px,4vw,22px) 12px;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.apphead .logo{
  font-family:var(--serif);font-weight:700;font-size:1.12rem;letter-spacing:-.01em;
  display:flex;align-items:center;gap:9px;color:var(--text);
}
.apphead .logo b{
  display:grid;place-items:center;width:26px;height:26px;border-radius:8px;
  background:var(--accent);color:#fff;font-family:var(--mono);font-weight:600;font-size:.82rem;
}
.apphead .spacer{flex:1}
.iconbtn{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  color:var(--text-mid);border:1px solid var(--line);background:var(--surface);
}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:18px;height:18px}

/* ===================== 탭바 ===================== */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
}
.tabbar .inner{max-width:var(--maxw);margin:0 auto;display:flex;width:100%}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-dim);font-size:.7rem;font-weight:600;letter-spacing:.02em;
  padding-top:8px;position:relative;
}
.tab svg{width:22px;height:22px;stroke-width:1.9}
.tab.on{color:var(--accent)}
.tab.on::before{
  content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--accent);
}
.tab .badge{
  position:absolute;top:4px;left:calc(50% + 9px);
  background:var(--bad);color:#fff;font-size:.58rem;font-weight:700;
  min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 3px;
}

/* ===================== 공통 요소 ===================== */
.section-label{
  font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-dim);margin:26px 2px 12px;
}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  box-shadow:var(--shadow-sm);
}
.hero{
  margin-top:18px;padding:22px 20px;border-radius:var(--r-l);color:#fff;
  position:relative;overflow:hidden;isolation:isolate;
  background:
    repeating-linear-gradient(0deg,  rgba(255,255,255,.055) 0 1px, transparent 1px 26px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.055) 0 1px, transparent 1px 26px),
    linear-gradient(142deg, #33429e 0%, #3f52d6 52%, #5b5cf0 100%);
  box-shadow:0 14px 34px -8px rgba(45,56,140,.5);
}
.hero::after{
  content:"";position:absolute;right:-70px;top:-90px;width:250px;height:250px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle, rgba(255,255,255,.18), rgba(255,255,255,0) 70%);
}
.hero h1{font-family:var(--serif);font-size:1.32rem;font-weight:700;letter-spacing:-.015em;margin-bottom:5px;text-wrap:balance}
.hero .subtitle{font-size:.8rem;opacity:.82;margin-bottom:20px;font-variant-numeric:tabular-nums}
.hero .ringrow{display:flex;align-items:center;gap:20px}
.ring{width:94px;height:94px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring .num b{font-family:var(--mono);font-weight:600;font-size:1.18rem;line-height:1}
.ring .num i{font-style:normal;font-size:.55rem;letter-spacing:.16em;opacity:.7;text-transform:uppercase}
.hero .stats{flex:1;display:flex;min-width:0}
.hero .stats div{flex:1;text-align:center;padding:0 2px}
.hero .stats div + div{border-left:1px solid rgba(255,255,255,.22)}
.hero .stats b{display:block;font-family:var(--mono);font-weight:600;font-size:1.16rem;line-height:1.25;font-variant-numeric:tabular-nums}
.hero .stats span{font-size:.66rem;opacity:.72;font-weight:600;letter-spacing:.02em}
.hero .resume{
  margin-top:20px;width:100%;background:#fff;border:none;
  color:#2f3fb0;font-weight:700;font-size:.92rem;padding:13px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 8px 18px -4px rgba(20,24,70,.35);
}
.hero .resume svg{color:#2f3fb0}
.hero .resume:active{transform:scale(.985);box-shadow:0 4px 10px -3px rgba(20,24,70,.3)}

/* 학습 모드 칩 */
.modes{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:8px 13px;border-radius:999px;border:1px solid var(--line-strong);
  background:var(--surface);font-size:.8rem;font-weight:600;color:var(--text-mid);white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .c{font-family:var(--mono);font-size:.72rem;opacity:.75}
.chip.on .c{opacity:.9}

/* 과목 카드 */
.subjlist{display:flex;flex-direction:column;gap:12px}
.subj{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  box-shadow:var(--shadow-sm);overflow:hidden;
}
.subj > button.subjtop{
  width:100%;display:flex;align-items:center;gap:13px;padding:15px 16px;text-align:left;
}
.subj .sidx{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  font-family:var(--mono);font-weight:600;font-size:.9rem;
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);
}
.subj .smeta{flex:1;min-width:0}
.subj .smeta h3{font-size:.98rem;font-weight:700;letter-spacing:-.01em}
.subj .smeta .sbar{margin-top:7px;height:5px;border-radius:3px;background:var(--surface-sunk);overflow:hidden}
.subj .smeta .sbar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s}
.subj .smeta .scount{font-size:.72rem;color:var(--text-dim);margin-top:5px;font-weight:500}
.subj .chev{color:var(--text-dim);transition:transform .25s;flex:none}
.subj.open .chev{transform:rotate(90deg)}
.subj .chapters{display:none;border-top:1px solid var(--line);background:var(--surface-2)}
.subj.open .chapters{display:block;animation:fade .2s ease}
.chaprow{
  width:100%;display:flex;align-items:center;gap:11px;padding:12px 16px 12px 18px;text-align:left;
  border-bottom:1px solid var(--line);
}
.chaprow:last-child{border-bottom:none}
.chaprow .cnum{font-family:var(--mono);font-size:.7rem;color:var(--text-dim);flex:none;width:38px}
.chaprow .ctitle{flex:1;font-size:.86rem;font-weight:500;color:var(--text-mid)}
.chaprow .cdot{width:7px;height:7px;border-radius:50%;background:var(--line-strong);flex:none}
.chaprow .cdot.part{background:var(--warn)}
.chaprow .cdot.done{background:var(--ok)}
.chaprow .cgo{color:var(--text-dim);flex:none}

/* ===================== 개념 뷰 ===================== */
.concept-wrap{padding-top:8px}
.crumbs{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--text-dim);font-weight:600;margin:14px 0 8px;flex-wrap:wrap}
.crumbs .sep{opacity:.5}
.crumbs .cur{color:var(--accent)}
.concept-h{font-family:var(--serif);font-size:1.42rem;font-weight:700;line-height:1.35;letter-spacing:-.015em;text-wrap:balance}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 4px}
.tag{font-size:.68rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-sunk);color:var(--text-mid);letter-spacing:.02em}
.tag.k{background:var(--accent-soft);color:var(--accent)}

.article{margin-top:8px}
.article > *{margin-top:15px}
.article p{color:var(--text-mid);font-size:.93rem}
.article p strong{color:var(--text);font-weight:700}
.article p code,.article li code{
  font-family:var(--mono);font-size:.86em;background:var(--surface-sunk);
  padding:1.5px 5px;border-radius:5px;color:var(--text);
}
.article h4{
  font-size:1.02rem;font-weight:700;letter-spacing:-.01em;color:var(--text);
  padding-top:6px;display:flex;align-items:center;gap:8px;
}
.article h4::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent);flex:none}
.article ul{padding-left:2px;list-style:none;display:flex;flex-direction:column;gap:7px}
.article ul li{position:relative;padding-left:18px;font-size:.9rem;color:var(--text-mid)}
.article ul li::before{content:"";position:absolute;left:3px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--accent-line)}

.steps{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:15px 16px;box-shadow:var(--shadow-sm)}
.steps .st-t{font-weight:700;font-size:.9rem;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.steps .st-t svg{width:16px;height:16px;color:var(--accent)}
.steps ol{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:0}
.steps ol li{
  counter-increment:s;position:relative;padding:9px 0 9px 38px;font-size:.88rem;color:var(--text-mid);
  border-bottom:1px dashed var(--line);
}
.steps ol li:last-child{border-bottom:none}
.steps ol li::before{
  content:counter(s);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:7px;
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);
  display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:.78rem;
}
.steps ol li b{color:var(--text);font-weight:600}

.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-sm)}
table.cmp{width:100%;border-collapse:collapse;font-size:.84rem;min-width:min(100%,420px)}
table.cmp th,table.cmp td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.cmp thead th{background:var(--surface-2);font-weight:700;color:var(--text);white-space:nowrap;font-size:.8rem}
table.cmp tbody th{background:var(--surface-2);font-weight:600;color:var(--text-mid);white-space:nowrap}
table.cmp tr:last-child th,table.cmp tr:last-child td{border-bottom:none}
table.cmp td{color:var(--text-mid)}
table.cmp td strong{color:var(--text)}

.formula{
  background:var(--surface-sunk);border:1px solid var(--line);border-radius:var(--r-m);
  padding:14px 16px;
}
.formula .fx{font-family:var(--mono);font-size:.92rem;color:var(--text);font-weight:500;overflow-x:auto;white-space:nowrap;padding-bottom:2px;display:block;letter-spacing:.01em}
.formula .fd{font-size:.8rem;color:var(--text-dim);margin-top:8px;white-space:normal}

.why{
  background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r-m);
  padding:14px 16px;position:relative;
}
.why .w-t{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.why .w-t svg{width:14px;height:14px}
.why p{color:var(--text-mid);font-size:.88rem}
:root[data-theme="dark"] .why p,:root:not([data-theme="light"]) .why p{color:var(--text)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .why p{color:var(--text)}}

.exam{
  background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);
  border-radius:var(--r-m);padding:14px 16px;
}
.exam .e-t{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.exam .e-t svg{width:14px;height:14px}
.exam ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.exam ul li{position:relative;padding-left:20px;font-size:.87rem;color:var(--text-mid)}
.exam ul li::before{content:"✔";position:absolute;left:0;top:0;color:var(--warn);font-size:.8rem;font-weight:700}
:root[data-theme="dark"] .exam ul li,:root:not([data-theme="light"]) .exam ul li{color:var(--text)}

/* 개념 하단 네비 */
.concept-foot{
  margin-top:26px;display:flex;flex-direction:column;gap:12px;
}
.mark-row{display:flex;gap:10px}
.mark-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:12px;border-radius:12px;border:1px solid var(--line-strong);
  background:var(--surface);font-weight:600;font-size:.86rem;color:var(--text-mid);
}
.mark-btn svg{width:17px;height:17px}
.mark-btn.done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok)}
.mark-btn.bm{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.nav-row{display:flex;gap:10px}
.nav-btn{
  flex:1;padding:13px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;gap:9px;font-size:.8rem;color:var(--text-mid);box-shadow:var(--shadow-sm);min-width:0;
}
.nav-btn.next{justify-content:flex-end;text-align:right}
.nav-btn:disabled{opacity:.4}
.nav-btn .lbl{font-size:.66rem;color:var(--text-dim);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.nav-btn .ttl{font-weight:600;color:var(--text);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.nav-btn svg{flex:none;width:18px;height:18px;color:var(--text-dim)}
.quiz-jump{
  width:100%;padding:13px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:.9rem;
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-md);
}
.quiz-jump:active{background:var(--accent-press)}

/* 개념 목차 시트 */
.sheet-back{
  position:fixed;inset:0;z-index:50;background:rgba(15,20,30,.5);
  display:none;align-items:flex-end;justify-content:center;
}
.sheet-back.on{display:flex;animation:fade .2s ease}
.sheet{
  background:var(--surface);width:100%;max-width:var(--maxw);max-height:82vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:8px 0 calc(env(safe-area-inset-bottom) + 16px);
  box-shadow:var(--shadow-lg);animation:slideup .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line-strong);margin:8px auto 6px}
.sheet h3{font-size:.82rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);padding:10px 20px}
.sheet .toc-s{font-family:var(--serif);font-size:.92rem;font-weight:700;padding:14px 20px 6px;color:var(--text);border-top:1px solid var(--line)}
.sheet .toc-c{display:block;width:100%;text-align:left;padding:10px 20px;font-size:.88rem;color:var(--text-mid);display:flex;gap:10px;align-items:center}
.sheet .toc-c.cur{color:var(--accent);background:var(--accent-soft);font-weight:600}
.sheet .toc-c .d{width:6px;height:6px;border-radius:50%;background:var(--line-strong);flex:none}
.sheet .toc-c .d.done{background:var(--ok)}

/* ===================== 문제 뷰 ===================== */
.quiz-setup{padding-top:8px}
.quiz-setup h2{font-family:var(--serif);font-size:1.3rem;font-weight:700;margin:16px 0 4px}
.quiz-setup .sub{font-size:.84rem;color:var(--text-dim);margin-bottom:18px}
.q-scope{display:flex;flex-direction:column;gap:9px}
.scope-btn{
  width:100%;display:flex;align-items:center;gap:12px;padding:14px 15px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-sm);
}
.scope-btn.on{border-color:var(--accent);background:var(--accent-soft)}
.scope-btn .sc-ic{width:32px;height:32px;flex:none;border-radius:9px;background:var(--surface-sunk);display:grid;place-items:center;color:var(--accent)}
.scope-btn.on .sc-ic{background:var(--accent);color:#fff}
.scope-btn .sc-m{flex:1;min-width:0}
.scope-btn .sc-m b{font-size:.92rem;font-weight:700;display:block}
.scope-btn .sc-m span{font-size:.74rem;color:var(--text-dim)}
.scope-btn .sc-n{font-family:var(--mono);font-size:.82rem;color:var(--text-mid);font-weight:500}
.scope-btn.dis{opacity:.45;pointer-events:none}

.q-start{
  margin-top:20px;width:100%;padding:15px;border-radius:14px;background:var(--accent);color:#fff;
  font-weight:700;font-size:.98rem;box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;gap:9px;
}
.q-start:active{background:var(--accent-press)}
.q-start:disabled{background:var(--line-strong);box-shadow:none}

.q-statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
.q-statgrid .qs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;text-align:center;box-shadow:var(--shadow-sm)}
.q-statgrid .qs b{font-family:var(--mono);font-size:1.3rem;font-weight:600;display:block;color:var(--text)}
.q-statgrid .qs span{font-size:.68rem;color:var(--text-dim);font-weight:600;letter-spacing:.03em}
.q-statgrid .qs.acc b{color:var(--accent)}

/* 문제 진행 */
.q-run{padding-top:calc(env(safe-area-inset-top) + 8px)}
.q-topbar{display:flex;align-items:center;gap:12px;padding:8px 0 14px}
.q-topbar .qclose{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--text-mid);border:1px solid var(--line);background:var(--surface);flex:none}
.q-prog{flex:1;height:6px;border-radius:3px;background:var(--surface-sunk);overflow:hidden}
.q-prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .35s}
.q-count{font-family:var(--mono);font-size:.8rem;color:var(--text-mid);font-weight:500;flex:none}

.q-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-md);padding:20px 18px;margin-top:4px}
.q-meta{display:flex;gap:7px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.q-meta .qt{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.q-meta .qt.ox{background:var(--warn-soft);color:var(--gold)}
.q-meta .qsrc{font-size:.72rem;color:var(--text-dim);font-weight:500}
.q-text{font-size:1.02rem;font-weight:600;line-height:1.6;color:var(--text);letter-spacing:-.01em;text-wrap:pretty}
.q-opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{
  display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface);text-align:left;font-size:.9rem;color:var(--text-mid);
  transition:border-color .15s,background .15s;
}
.opt .ok-key{
  width:24px;height:24px;flex:none;border-radius:7px;border:1.5px solid var(--line-strong);
  display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:.8rem;color:var(--text-dim);
}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .ok-key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);color:var(--text)}
.opt.correct .ok-key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--text)}
.opt.wrong .ok-key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.ox{align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;padding:18px}
.opt:disabled{cursor:default}

.q-explain{
  margin-top:14px;border-radius:14px;padding:15px 16px;border:1px solid var(--line);background:var(--surface-2);
  display:none;
}
.q-explain.show{display:block;animation:fade .25s ease}
.q-explain .ex-v{font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:7px;margin-bottom:7px}
.q-explain .ex-v.o{color:var(--ok)}
.q-explain .ex-v.x{color:var(--bad)}
.q-explain p{font-size:.87rem;color:var(--text-mid);line-height:1.6}
.q-explain .ex-link{margin-top:10px;font-size:.8rem;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:5px}

.q-next{
  margin-top:16px;width:100%;padding:14px;border-radius:13px;background:var(--accent);color:#fff;font-weight:700;font-size:.92rem;
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-md);
}
.q-next:active{background:var(--accent-press)}
.q-next.ghost{background:var(--surface);color:var(--text-mid);border:1px solid var(--line-strong);box-shadow:var(--shadow-sm)}

/* 결과 */
.q-result{text-align:center;padding-top:30px}
.q-result .rring{width:130px;height:130px;margin:0 auto 18px;position:relative}
.q-result .rring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:1.8rem;font-weight:600}
.q-result h2{font-family:var(--serif);font-size:1.4rem;font-weight:700}
.q-result .rmsg{color:var(--text-dim);font-size:.86rem;margin-top:4px}
.q-result .rbreak{display:flex;justify-content:center;gap:22px;margin:20px 0}
.q-result .rbreak div{font-size:.74rem;color:var(--text-dim);font-weight:600}
.q-result .rbreak b{display:block;font-family:var(--mono);font-size:1.4rem;color:var(--text)}
.q-result .rbreak b.o{color:var(--ok)} .q-result .rbreak b.x{color:var(--bad)}
.q-result .ractions{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.q-result .ractions button{padding:13px;border-radius:12px;font-weight:700;font-size:.88rem}
.q-result .ractions .primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-md)}
.q-result .ractions .sec{background:var(--surface);border:1px solid var(--line-strong);color:var(--text-mid)}

.empty{text-align:center;padding:50px 20px;color:var(--text-dim)}
.empty svg{width:40px;height:40px;margin-bottom:12px;opacity:.5}
.empty p{font-size:.88rem}

.toast{
  position:fixed;left:50%;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);
  transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.82rem;font-weight:600;
  box-shadow:var(--shadow-lg);opacity:0;transition:.28s;z-index:60;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.foot-note{text-align:center;font-size:.72rem;color:var(--text-dim);margin:30px 0 4px;line-height:1.7}
</style>
</head>

  ["exam",[
    "반정형의 핵심 = '스키마를 데이터와 함께 제공(self-describing)'. HTML·JSON·XML·웹로그는 반정형.",
    "구간척도 vs 비율척도의 구분점 = **절대 영점(0)의 유무**. 섭씨온도는 구간척도(0℃가 '온도 없음'이 아님).",
  ]],
]},

{id:"c103", s:1, c:"1-1-1", t:"빅데이터의 특성 — 3V · 5V · 7V", tag:["개념","비교","빈출"], b:[
  ["p","빅데이터를 정의하는 특성. **3V**(Doug Laney, 2001, 現 Gartner)가 기본이며 이후 확장되었다."],
  ["table",["V","한글","의미"],[
    ["Volume","규모","데이터의 절대량 (TB·PB·EB·ZB). 저장·처리 방식을 좌우"],
    ["Variety","다양성","정형·반정형·비정형, 내부·외부 등 형태와 출처의 다양성"],
    ["Velocity","속도","데이터의 생성·수집·처리 속도. 배치 ↔ 실시간(스트리밍)"],
    ["Veracity","정확성/신뢰성","불확실성·노이즈·편향 속에서 데이터를 신뢰할 수 있는가 (IBM이 강조) — 5V"],
    ["Value","가치","분석으로 도출되는 비즈니스 가치. 가장 중요하나 사전 산정이 어려움 — 5V"],
    ["Validity","유효성","데이터가 분석 목적에 부합하고 정확한가 — 7V"],
    ["Volatility","휘발성","데이터가 얼마 동안 유효하며 얼마나 보관할 가치가 있는가 — 7V"],
  ]],
  ["exam",[
    "**3V = Volume · Variety · Velocity** (반드시 암기). + Veracity + Value = 5V.",
    "Value는 '가장 중요하지만 추출·사전 산정이 어렵다'는 맥락으로 출제.",
    "Veracity(정확성)와 Validity(유효성)를 바꿔 내는 함정 주의.",
  ]],
  ["why","'빅데이터인가'는 크기만으로 판단하지 않는다. 초당 수만 건이 유입되는 IoT 스트림은 총량이 작아도 Velocity 때문에 분산·스트리밍 인프라가 필요하다."],
]},

{id:"c104", s:1, c:"1-1-1", t:"빅데이터 활용의 3요소와 가치 산정의 어려움", tag:["개념"], b:[
  ["table",["요소","내용"],[
    ["자원(데이터)","정형·반정형·비정형 데이터를 실시간 수집하고 전처리로 품질을 확보"],
    ["기술","분산 파일시스템 기반 대용량 분산 처리, 데이터마이닝·시각화, 스스로 학습하는 AI"],
    ["인력","통계·수학·컴퓨터공학·경영학 등 전문지식 + **도메인 지식**으로 결과를 해석 (데이터 사이언티스트)"],
  ]],
  ["h","빅데이터 가치 산정이 어려운 이유"],
  ["ul",[
    "**데이터 활용 방식의 다양성**: 같은 데이터가 여러 방식으로 재사용되어 특정 데이터의 기여도를 분리하기 어렵다.",
    "**새로운 가치 창출**: 기존에 없던 가치를 만들어 비교 기준이 없다.",
    "**분석 기술의 발전**: 과거에 쓸모없던 데이터가 새 기술로 가치를 갖게 된다.",
    "**데이터 재사용·재조합**: 다른 데이터와 결합해 예상치 못한 가치가 생긴다.",
  ]],
  ["exam",["3요소 = 자원·기술·인력. '인력'에 도메인 지식이 포함된다는 점, 가치 산정 어려움 4가지."]],
]},

{id:"c105", s:1, c:"1-1-1", t:"분석용 저장소 아키텍처 — DW · DM · ODS · ETL · 데이터 레이크", tag:["개념","비교"], b:[
  ["table",["용어","정의","핵심 특징"],[
    ["ODS (운영 데이터 스토어)","여러 운영 시스템에서 추출한 데이터를 통합·정제해 보관하는 영역","최신 상태 유지, 짧은 보관 주기, DW의 전(前)단계"],
    ["DW (데이터 웨어하우스)","의사결정 지원을 위해 여러 원천의 데이터를 주제별로 통합·축적한 DB","주제지향성·통합성·시계열성·비휘발성 (Inmon의 정의)"],
    ["DM (데이터 마트)","특정 부서·주제 영역에 맞춰 구성한 소규모 DW","구축이 빠르고 부서 요구에 최적화, 전사 정합성 관리 부담"],
    ["ETL","Extract(추출) → Transform(변환·정제) → Load(적재). 원천에서 DW로 데이터를 옮기는 과정","최근 클라우드에서는 먼저 적재 후 변환하는 ELT도 사용"],
    ["데이터 레이크","정형·반정형·비정형 원천 데이터를 원본 형태 그대로 저장","schema-on-read(읽을 때 구조 부여), 대용량·저비용, 거버넌스 없으면 'data swamp' 위험"],
  ]],
  ["h","DW 구축 관점 두 가지"],
  ["ul",[
    "**Inmon (하향식)**: 전사 DW를 먼저 구축하고 여기서 데이터 마트를 파생. 정합성↑, 초기 비용·기간↑.",
    "**Kimball (상향식)**: 부서별 데이터 마트를 먼저 만들고 이를 통합해 DW로 확장. 빠른 성과, 통합 관리 부담.",
  ]],
  ["exam",[
    "DW의 4대 특성 = **주제지향성 · 통합성 · 시계열성(시간에 따른 변화 축적) · 비휘발성(적재 후 갱신·삭제 없이 조회만)**.",
    "ETL 순서 = 추출→변환→적재. 데이터 레이크 = schema-on-read, DW = schema-on-write.",
  ]],
]},

{id:"c106", s:1, c:"1-1-2", t:"빅데이터 처리 과정 (수집 → 저장 → 처리 → 분석 → 표현)", tag:["개념","프로세스"], b:[
  ["steps","처리 파이프라인",[
    "**수집**: 크롤링, 로그 수집기, 센서 네트워크, RSS/Open API, ETL로 내·외부 데이터를 확보.",
    "**저장(공유)**: 분산 파일시스템(HDFS), NoSQL, 병렬 DBMS에 대용량 저장.",
    "**처리**: 분산·병렬 컴퓨팅(MapReduce/Spark)으로 대용량을 분할·병렬 계산. 배치 처리와 실시간(스트림) 처리로 구분.",
    "**분석**: 탐색적 데이터 분석(EDA), 통계 검정, 데이터마이닝·머신러닝·딥러닝 모델링.",
    "**표현(시각화)**: 차트·대시보드·인포그래픽으로 결과를 전달하고 의사결정에 연결.",
  ]],
  ["h","분석 단계 — 두 가지 요인분석"],
  ["ul",[
    "**탐색적 요인분석(EFA)**: 변수 간 상관을 바탕으로 잠재 요인 구조를 **탐색·발견** (사전 가설 없음).",
    "**확인적 요인분석(CFA)**: 이론·선행연구로 미리 세운 요인 구조가 관측 데이터에 부합하는지 **검증** (구조방정식 모델의 일부).",
  ]],
  ["exam",["크롤링 = '분산 저장된 문서를 수집해 검색 색인에 포함시키는 기술' → 수집 단계. EFA=발견, CFA=검증."]],
]},

{id:"c107", s:1, c:"1-1-2", t:"하둡 에코시스템 — HDFS · MapReduce · YARN", tag:["개념","기술","빈출"], b:[
  ["p","**하둡(Hadoop)**: 저비용 상용 서버를 수평 확장(scale-out)해 대용량 데이터를 분산 저장·처리하는 오픈소스 프레임워크. 구글의 GFS·MapReduce 논문을 기반으로 만들어졌다."],
  ["h","핵심 3요소"],
  ["table",["구성","역할","구조"],[
    ["HDFS","분산 파일 저장. 파일을 블록으로 나눠 여러 노드에 복제 저장","NameNode(메타데이터 관리) + DataNode(실제 블록 저장). 기본 블록 128MB, 기본 복제 3, write-once-read-many"],
    ["MapReduce","분산 병렬 연산 프로그래밍 모델","Map(분할·처리) → Shuffle&Sort → Reduce(집계)"],
    ["YARN","클러스터 자원 관리·작업 스케줄링 (Hadoop 2.0 도입)","ResourceManager + NodeManager + 잡별 ApplicationMaster"],
  ]],
  ["h","주변 프로젝트"],
  ["table",["도구","용도"],[
    ["Hive","HDFS 데이터를 SQL 유사 언어(HiveQL)로 질의 → MapReduce/Tez로 변환"],
    ["Pig","데이터 흐름(dataflow) 스크립트 언어(Pig Latin)"],
    ["HBase","HDFS 기반 칼럼 지향 NoSQL, 실시간 랜덤 읽기/쓰기"],
    ["Sqoop","관계형 DB ↔ 하둡 간 대량 정형 데이터 전송"],
    ["Flume / Kafka","대용량 로그·이벤트 스트림 수집·중계"],
    ["Spark","인메모리 기반 분산 처리 엔진. 반복 연산에서 MapReduce보다 수십 배 빠름"],
    ["Oozie","하둡 작업 워크플로 스케줄러"],
    ["Zookeeper","분산 코디네이션(설정 공유·리더 선출·동기화)"],
  ]],
  ["exam",[
    "'구글이 발표한 병렬 처리 프로그래밍 모델' = MapReduce (하둡은 그 오픈소스 구현).",
    "HDFS 기본값: 블록 128MB, 복제 계수 3, NameNode는 메타데이터만 보관.",
    "Sqoop = 정형(RDB) / Flume = 비정형(로그). Spark의 키워드 = '인메모리'.",
  ]],
]},

{id:"c108", s:1, c:"1-3-2", t:"NoSQL의 4가지 데이터 모델과 CAP 정리", tag:["개념","비교","빈출"], b:[
  ["p","**NoSQL(Not Only SQL)**: 관계형 모델을 단순화한 비관계형 DB. 스키마가 유연하고 수평 확장(분산)에 유리하며, 대량·고속 처리에서 관계형 DB보다 성능이 좋다. 대신 조인·트랜잭션 기능이 제한적이다."],
  ["table",["모델","저장 단위","특징","예"],[
    ["Key-Value","(키, 값) 쌍","가장 단순, 초고속 조회, 값의 구조는 알지 못함","Redis, DynamoDB"],
    ["Column-oriented(Wide-column)","행이 아닌 칼럼(칼럼 패밀리) 단위","특정 칼럼 집계·범위 스캔에 유리, 관계형보다 확장성↑·질의 응답 빠름","HBase, Cassandra"],
    ["Document","JSON/BSON/XML 문서","문서 내부 구조(중첩 필드)에 기반한 복잡한 질의 가능, key-value보다 표현력↑","MongoDB, CouchDB"],
    ["Graph","노드 + 엣지(관계)","관계 탐색(경로·이웃)이 빠름, 소셜·추천·부정탐지","Neo4j"],
  ]],
  ["h","CAP 정리 (Brewer의 정리)"],
  ["p","분산 시스템은 다음 세 속성을 **동시에 모두 만족할 수 없고 최대 2개**만 보장한다."],
  ["ul",[
    "**일관성(Consistency)**: 모든 노드가 같은 시점에 같은 데이터를 본다.",
    "**가용성(Availability)**: 모든 요청이 (성공/실패의) 응답을 받는다.",
    "**분단 내성(Partition tolerance)**: 노드 간 통신이 끊겨도 시스템이 계속 동작한다.",
    "네트워크 분단은 현실에서 불가피하므로, 분단이 발생하면 **일관성(CP) 또는 가용성(AP) 중 하나를 포기**한다.",
  ]],
  ["exam",[
    "Column-oriented의 키워드 = '로우가 아닌 칼럼 기반 저장·처리'.",
    "CAP = 3개 중 2개만. NoSQL은 ACID 대신 **BASE**(Basically Available, Soft state, Eventual consistency, 최종 일관성) 지향.",
  ]],
]},

{id:"c109", s:1, c:"1-1-2", t:"분산·병렬 컴퓨팅과 MapReduce 동작 원리", tag:["원리","기술"], b:[
  ["p","**분산 병렬 컴퓨팅**: 네트워크로 연결된 독립 컴퓨팅 자원을 미들웨어로 제어해 하나의 시스템처럼 동작시켜, 큰 작업을 잘게 나눠 동시에 처리하는 기술."],
  ["steps","MapReduce — WordCount 예시로 본 단계",[
    "**Input Split**: 입력 파일을 고정 크기 조각으로 분할하고, 데이터가 있는 노드에서 처리하도록 배치(data locality).",
    "**Map**: 각 노드가 자기 조각을 읽어 (key, value) 쌍을 방출. 예: 단어마다 (word, 1).",
    "**Shuffle & Sort**: 동일 key의 쌍을 같은 리듀서로 모으고 key 기준 정렬. 네트워크 전송이 일어나는 구간.",
    "**Reduce**: 리듀서가 같은 key의 value들을 집계. 예: (word, 1,1,1,…) → (word, 합계).",
    "**Output**: 결과를 HDFS에 파일로 기록.",
  ]],
  ["ul",[
    "Map = 병렬화가 쉬운 '분할 처리', Reduce = '모아서 집계'. SQL의 GROUP BY, Spark 연산도 같은 사고방식.",
    "**한계**: 단계마다 중간 결과를 디스크에 쓰고 Shuffle에서 네트워크 병목이 발생 → 반복 연산이 많은 머신러닝에는 인메모리 엔진(Spark)이 훨씬 유리.",
  ]],
  ["exam",["순서 = Split → Map → Shuffle/Sort → Reduce → Output. Shuffle이 성능 병목."]],
]},

{id:"c110", s:1, c:"1-1-2", t:"개인정보 보호와 비식별 조치 5기법", tag:["개념","제도"], b:[
  ["p","**개인정보**: 살아 있는 개인에 관한 정보로서 성명·주민번호 등으로 개인을 알아볼 수 있거나, **다른 정보와 쉽게 결합하여** 알아볼 수 있는 정보를 포함한다. 분석에 활용하려면 식별성을 낮추는 **비식별 조치**가 필요하다."],
  ["table",["기법","방법","예"],[
    ["가명처리","식별 요소를 다른 값(가명)으로 대체","홍길동 → 회원 A"],
    ["총계처리(집계)","개별 값을 통계값(합계·평균 등)으로 대체","각자 키 대신 '집단 평균 172cm'"],
    ["데이터 삭제","식별에 불필요한 값을 제거","주민번호 뒷자리 삭제, 특이정보 삭제"],
    ["데이터 범주화(일반화)","값을 구간·범주로 대체","28세 → 20대, 서울 강남구 → 서울"],
    ["데이터 마스킹","값의 일부를 * 등으로 가림","홍○○, 010-****-1234"],
  ]],
  ["h","가명정보 · 익명정보 (데이터 3법, 2020년 개정)"],
  ["ul",[
    "**데이터 3법** = 개인정보보호법 · 정보통신망법 · 신용정보법.",
    "**가명정보**: 추가 정보의 사용 없이는 특정 개인을 알아볼 수 없게 처리한 정보. **통계작성 · 과학적 연구 · 공익적 기록보존** 목적에 한해 정보주체 동의 없이 처리 가능(개인정보로는 남아 있음).",
    "**익명정보**: 시간·비용·기술을 합리적으로 고려해도 다시 식별할 수 없는 정보. 개인정보보호법의 규율 대상이 아님(자유 활용).",
  ]],
  ["exam",[
    "5기법의 이름-예시 매칭. **범주화(값→구간) vs 총계처리(값→통계량)** 구분이 함정.",
    "가명정보의 동의 예외 3목적: 통계작성·과학적 연구·공익적 기록보존.",
  ]],
]},

{id:"c111", s:1, c:"1-3-1", t:"프라이버시 보호 모델 — k-익명성 · l-다양성 · t-근접성", tag:["개념","비교","빈출"], b:[
  ["p","비식별 결과가 재식별 공격에 충분히 안전한지 판단하는 **정량 기준**. 뒤 모델이 앞 모델의 취약점을 보완하는 순서로 발전했다."],
  ["table",["모델","보장 내용","방어하는 공격"],[
    ["k-익명성 (Sweeney)","동일한 준식별자 조합을 갖는 레코드가 **최소 k개** 존재 → 개인 특정 확률 ≤ 1/k","연결 공격(linkage)"],
    ["l-다양성 (Machanavajjhala)","각 동질집합(준식별자가 같은 그룹)의 민감정보가 **서로 다른 값을 최소 l개** 보유","동질성 공격(그룹의 민감값이 모두 같음), 배경지식 공격"],
    ["t-근접성 (Li)","각 동질집합의 민감정보 분포가 **전체 분포와의 차이 t 이하**","쏠림 공격(skewness), 유사성 공격(민감값이 의미상 비슷)"],
  ]],
  ["h","용어"],
  ["ul",[
    "**식별자**: 단독으로 개인을 특정 (이름, 주민번호) → 비식별 시 원칙적으로 삭제.",
    "**준식별자(속성자)**: 단독으론 불충분하나 조합하면 특정 가능 (생년월일 + 성별 + 우편번호).",
    "**민감정보**: 노출 시 프라이버시 침해가 큰 값 (질병, 정치성향, 소득).",
  ]],
  ["exam",[
    "발전·보완 순서: k-익명성 → (동질성/배경지식 공격 취약) → l-다양성 → (쏠림/유사성 공격 취약) → t-근접성.",
    "k-익명성에서 특정 개인 재식별 확률 = **1/k**.",
  ]],
]},

{id:"c112", s:1, c:"1-2-1", t:"분석 과제 도출 — 하향식 vs 상향식 접근", tag:["개념","비교"], b:[
  ["table",["구분","하향식 (Top-down)","상향식 (Bottom-up)"],[
    ["전제","해결할 문제가 명확히 정의되어 있음","문제 정의 자체가 어렵거나 불명확함"],
    ["절차","문제 → 가설 수립 → 데이터로 검증","데이터 관찰 → 패턴·인사이트 발견 → 문제를 재정의"],
    ["추론 방식","연역적(deductive)","귀납적(inductive), 실험적"],
    ["방법","문제 탐색 → 문제 정의 → 해결방안 탐색 → 타당성 검토","프로토타이핑, 디자인 씽킹, 비지도학습 기반 탐색"],
  ]],
  ["h","하향식 — 문제 탐색 (비즈니스 모델 캔버스 기반)"],
  ["ul",[
    "**5개 영역**: 업무 · 제품 · 고객 · 규제와 감사 · 지원 인프라 에서 분석 기회를 발굴.",
    "외부 참조 모델(경쟁사·유사 산업 사례)과 분석 유즈케이스로 후보 과제를 구체화.",
  ]],
  ["exam",["'문제 정의가 어려워 데이터에서 문제를 재정의' = 상향식. 프로토타이핑·디자인씽킹 = 상향식."]],
]},

{id:"c113", s:1, c:"1-2-1", t:"데이터 분석 방법론 — KDD · CRISP-DM · SEMMA", tag:["개념","비교","빈출"], b:[
  ["p","데이터 분석·마이닝의 절차를 표준화한 대표 방법론 세 가지. **단계 수와 명칭**을 정확히 구분해야 한다."],
  ["h","KDD — 5단계 (Fayyad et al., 1996)"],
  ["ul",["① **데이터셋 선택**(Selection) → ② **전처리**(Preprocessing, 정제·잡음 제거) → ③ **변환**(Transformation, 차원 축소·특징 생성) → ④ **데이터 마이닝**(Data Mining, 알고리즘 적용) → ⑤ **해석·평가**(Interpretation/Evaluation)"]],
  ["h","CRISP-DM — 6단계 (1999, 산업 표준·가장 널리 사용)"],
  ["ul",["① **업무 이해**(Business Understanding) → ② **데이터 이해**(Data Understanding) → ③ **데이터 준비**(Data Preparation) → ④ **모델링**(Modeling) → ⑤ **평가**(Evaluation) → ⑥ **전개**(Deployment)"]],
  ["p","**반복·순환 구조**: 단계 간 피드백 루프가 있어 필요 시 이전 단계로 되돌아간다(예: 평가 결과가 미흡하면 업무 이해로 복귀, 데이터 이해 ↔ 데이터 준비, 모델링 ↔ 평가). 세 방법론 중 **'전개(Deployment)' 단계를 명시적으로 갖는 유일한 방법론**이다."],
  ["h","SEMMA — 5단계 (SAS 사)"],
  ["ul",["① **추출**(Sample) → ② **탐색**(Explore) → ③ **수정**(Modify, 변수 변환·선택) → ④ **모델링**(Model) → ⑤ **평가**(Assess). SAS Enterprise Miner 도구 사용 절차에 최적화되어 있으며 **'업무 이해' 단계가 없다**."]],
  ["h","단계 간 대략적 대응"],
  ["table",["KDD (5)","CRISP-DM (6)","SEMMA (5)"],[
    ["— (해당 없음)","업무 이해","— (해당 없음)"],
    ["데이터셋 선택","데이터 이해","추출(Sample)"],
    ["전처리","데이터 준비","탐색(Explore)"],
    ["변환","데이터 준비","수정(Modify)"],
    ["데이터 마이닝","모델링","모델링(Model)"],
    ["해석·평가","평가","평가(Assess)"],
    ["— (해당 없음)","전개","— (해당 없음)"],
  ]],
  ["exam",[
    "단계 수: **KDD 5 · CRISP-DM 6 · SEMMA 5**.",
    "CRISP-DM만 6단계이며 **'전개(Deployment)'로 종료**, 순환(반복) 구조.",
    "SEMMA는 순서 S-E-M-M-A, '업무 이해' 없음. KDD는 '데이터 마이닝'을 하나의 단계 명칭으로 사용.",
  ]],
]},

{id:"c114", s:1, c:"1-2-1", t:"빅데이터 분석 방법론 5단계 (계층적 구조)", tag:["개념","프로세스"], b:[
  ["p","빅데이터 분석 프로젝트를 **단계(Phase) → 태스크(Task) → 스텝(Step)**의 계층으로 관리하는 방법론. CRISP-DM에 '시스템 구현'을 더한 형태로 볼 수 있다."],
  ["steps","5단계",[
    "**분석 기획**: 비즈니스 이해와 범위 설정, 프로젝트 정의, 수행 계획 수립, **위험 계획 수립**(회피·전이·완화·수용).",
    "**데이터 준비**: 필요 데이터 정의, 데이터 스토어(정형·비정형) 설계, 데이터 수집·정합성 점검.",
    "**데이터 분석**: 분석용 데이터 준비, 텍스트 분석, **탐색적 분석(EDA)**, 모델링, 모델 평가·검증.",
    "**시스템 구현**: 설계·구현, 시스템 테스트 및 운영.",
    "**평가 및 전개**: 모델 발전 계획 수립, 프로젝트 평가·보고.",
  ]],
  ["h","분석 프로젝트 관리의 5가지 속성"],
  ["ul",[
    "**Data Size** · **Data Complexity**(원천 데이터가 여러 시스템에 산재) · **Speed**(분석·활용의 속도 요구) · **Analytic Complexity**(모델이 복잡할수록 정확도↑, 해석성↓ — trade-off) · **Accuracy & Precision**(정확도=활용 관점의 참값 근접, 정밀도=반복 시 일관성·모델 안정성, 둘은 상충).",
  ]],
  ["exam",["'정확도는 모델 활용 측면, 정밀도는 모델 안정성 측면에서 중요하며 서로 trade-off'."]],
]},

{id:"c115", s:1, c:"1-2-1", t:"데이터 거버넌스 · 메타데이터 · 마스터데이터", tag:["개념","제도"], b:[
  ["p","**데이터 거버넌스**: 전사(全社) 차원에서 데이터에 대한 정책·지침·표준·조직·프로세스를 수립하고 운영하는 관리 체계. 목표는 데이터의 **가용성 · 유용성 · 통합성 · 보안성 · 안전성** 확보."],
  ["table",["구성요소","내용"],[
    ["원칙(Principle)","데이터를 유지·관리하기 위한 지침·가이드 (보안·품질 기준, 변경 관리)"],
    ["조직(Organization)","데이터를 관리할 조직의 역할과 책임 (데이터 관리자 Data Steward, DBA, 데이터 아키텍트)"],
    ["프로세스(Process)","데이터 관리를 위한 활동과 체계 (작업 절차, 모니터링 활동, 측정 지표)"],
  ]],
  ["h","주요 데이터 관리 대상"],
  ["ul",[
    "**메타데이터**: 다른 데이터를 설명하는 데이터 (테이블·칼럼 정의, 데이터 계보(lineage), 갱신 주기).",
    "**마스터데이터**: 업무의 기준이 되며 자주 바뀌지 않는 핵심 데이터 (고객·상품·조직·계정 코드). MDM(Master Data Management)으로 유일·일관성 유지.",
  ]],
  ["exam",["거버넌스 구성요소 3가지 = 원칙·조직·프로세스. 확보 대상 5가지(가용성·유용성·통합성·보안성·안전성)."]],
]},

{id:"c116", s:1, c:"1-2-1", t:"분석 성숙도 모델과 분석 준비도", tag:["개념","비교"], b:[
  ["h","분석 성숙도 (CMMI 기반) — 4단계"],
  ["table",["단계","조직 상태"],[
    ["도입","분석을 위한 환경·시스템을 구축하기 시작하는 단계"],
    ["활용","분석 결과를 실제 업무에 적용하는 단계"],
    ["확산","전사 차원에서 분석을 관리·공유하며 확산하는 단계 (전사 성과 관리, 분석 CoE 운영)"],
    ["최적화","분석을 지속적으로 진화시켜 비즈니스 혁신·차별화에 활용하는 단계"],
  ]],
  ["h","분석 준비도 — 6개 진단 영역"],
  ["ul",["분석 업무 파악 · 인력 및 조직 · 분석 기법 · 분석 데이터 · 분석 문화 · IT 인프라. 각 영역의 항목 충족 여부로 조직의 분석 준비 수준을 평가."]],
  ["h","분석 준비도 × 성숙도 4사분면"],
  ["table",["유형","준비도","성숙도","의미"],[
    ["준비형","낮음","낮음","준비도·성숙도 모두 낮음 — 사전 준비가 필요"],
    ["정착형","낮음","높음","준비도는 낮으나 일부 분석이 사내에 정착"],
    ["도입형","높음","낮음","조직·인력 등 준비는 되어 있으나 분석 성숙도는 낮음 → 바로 도입 가능"],
    ["확산형","높음","높음","전사적으로 분석을 확산·활용하는 가장 성숙한 상태"],
  ]],
  ["exam",["성숙도 순서 = 도입·활용·확산·최적화. 사분면: 준비도만 높으면 **도입형**, 성숙도만 높으면 **정착형**(헷갈림 주의)."]],
]},

{id:"c117", s:1, c:"1-2-2", t:"분석 과제 우선순위 결정 — 시급성·난이도 매트릭스", tag:["원리","의사결정"], b:[
  ["p","여러 후보 과제를 **시급성**(전략적 중요도·목표 달성 기여도)과 **난이도**(데이터 확보·기술·비용·범위)로 4사분면에 배치한다."],
  ["table",["사분면","시급성","난이도","설명"],[
    ["I","현재","어려움","시급하나 난도가 높음 — 나중으로 미루거나 범위를 분할해 접근"],
    ["II","미래","어려움","가장 후순위"],
    ["III","현재","쉬움","**최우선 수행**"],
    ["IV","미래","쉬움","시급성은 낮으나 쉬움"],
  ]],
  ["ul",[
    "**시급성을 우선 기준**으로 하면 진행 순서: III → IV → I (또는 III → IV → II).",
    "**난이도를 우선 기준**으로 하면 진행 순서: III → I → IV.",
    "가장 먼저 하는 것은 항상 **III(시급·쉬움)**, 가장 뒤는 **II(미래·어려움)**.",
  ]],
  ["exam",["기준(시급성 우선 / 난이도 우선)에 따라 중간 순서가 달라진다. 첫 번째는 언제나 3사분면."]],
]},

{id:"c118", s:1, c:"1-2-2", t:"데이터 전처리 4단계와 품질 기준", tag:["개념","프로세스"], b:[
  ["p","분석 가능한 형태로 데이터를 다듬는 과정으로, 실무에서 전체 분석 시간의 상당 부분(흔히 70~80%)을 차지한다."],
  ["table",["단계","내용"],[
    ["정제(Cleaning)","결측치 처리, 이상치·잡음 제거, 오류·불일치 수정"],
    ["통합(Integration)","여러 출처의 데이터를 결합, 스키마·명칭·단위 충돌 및 중복 해소"],
    ["축소(Reduction)","분석 결과를 훼손하지 않으면서 데이터 양을 줄임 (차원 축소, 수량 축소=표본추출, 데이터 압축)"],
    ["변환(Transformation)","정규화·집계·일반화(범주화)·속성 생성(파생변수) 등 형태 변경"],
  ]],
  ["h","데이터 품질 기준"],
  ["table",["정형 데이터","비정형 데이터 (SW 품질특성 차용)"],[
    ["완전성(필수항목 누락 없음)","기능성"],
    ["유일성(중복 없음)","신뢰성"],
    ["유효성(허용 범위·도메인 충족)","사용성"],
    ["일관성(구조·값·표현이 일관)","효율성"],
    ["정확성(현실을 정확히 반영)","이식성"],
  ]],

{id:"c121", s:1, c:"1-2-1", t:"빅데이터 분석 조직의 3가지 구조", tag:["개념","비교"], b:[
  ["table",["유형","구조","장점","단점"],[
    ["집중형(집중 구조)","전사 분석 업무를 전담하는 별도 조직을 신설","전사 과제를 우선순위화해 통합 수행, 중복 투자 방지","현업 부서와 이원화되어 업무 요청·소통에 마찰"],
    ["기능형(기능 중심)","별도 조직 없이 각 현업 부서가 직접 분석 수행","해당 부서 업무 맥락에 최적화","전사 관점의 핵심 분석이 어렵고 부서 간 분석이 중복"],
    ["분산형(분산 구조)","분석 전문 인력을 현업 부서에 배치","현업 밀착 + 전사 협업 가능, 신속한 실행","인력 확보 부담, 조직 간 역할·평가 조정 필요"],
  ]],
  ["exam",["'전문 인력을 현업 부서에 배치' = 분산형. '별도 전담 조직' = 집중형. '부서가 알아서' = 기능형."]],
]},

{id:"c122", s:1, c:"1-1-2", t:"빅데이터 플랫폼 아키텍처 — 계층 구조와 람다·카파", tag:["개념","기술"], b:[
  ["p","**빅데이터 플랫폼**: 데이터의 수집부터 서비스까지를 계층으로 나눠 통합 처리하는 환경."],
  ["table",["계층","역할","기술 예"],[
    ["수집","내·외부 원천에서 데이터 확보","Kafka, Flume, Sqoop, NiFi"],
    ["저장","원본·가공 데이터 보관","HDFS, S3, NoSQL, DW"],
    ["처리","배치·실시간 연산","MapReduce, Spark, Flink, Storm"],
    ["분석","통계·머신러닝·질의","Hive, Spark MLlib, R, Python"],
    ["서비스(표현)","대시보드·API로 결과 제공","BI 도구, Zeppelin, REST API"],
  ]],
  ["h","실시간 처리 아키텍처 두 가지"],
  ["ul",[
    "**람다(Lambda)**: 배치 레이어(전체 데이터, 정확·느림) + 스피드 레이어(최근 데이터, 근사·빠름) + 서빙 레이어를 병행. 정확성과 저지연을 모두 얻지만 배치·스트림 로직을 이중으로 유지해야 한다.",
    "**카파(Kappa)**: 스트림 처리 레이어 하나로 통합. 과거 데이터 재처리는 로그(Kafka)를 되감아 재생(replay). 구조가 단순하고 코드가 하나.",
  ]],
  ["exam",["계층 순서 = 수집→저장→처리→분석→서비스. 람다=배치+스피드 이중 구조, 카파=스트림 단일 구조."]],
]},

{id:"c123", s:1, c:"1-1-2", t:"빅데이터의 위기 요인과 통제 방안", tag:["개념","제도"], b:[

    ["데이터 오용","잘못된 지표나 상관관계를 인과로 오해해 그릇된 의사결정","**알고리즈미스트**(알고리즘의 부작용·피해를 진단·중재하는 전문가) 도입, 분석 과정·결과 검증"],
  ]],
  ["exam",["'동의제에서 책임제로' = 사생활 침해 통제. '알고리즈미스트' = 데이터 오용 통제."]],

{id:"c201", s:2, c:"2-1-1", t:"결측치의 3가지 발생 메커니즘 — MCAR·MAR·MNAR", tag:["개념","비교","빈출"], b:[
  ["p","**결측치(missing data)**를 어떻게 처리할지는 '왜 비었는가'에 달려 있다. 발생 메커니즘을 잘못 판단하면 대치가 편향을 만든다."],
  ["table",["메커니즘","정의","예"],[
    ["MCAR (완전 무작위 결측)","결측이 다른 어떤 변수와도 무관, 순수 우연","설문지 일부가 인쇄 오류로 누락"],
    ["MAR (무작위 결측)","결측이 '관측된 다른 변수'로 설명됨, 결측값 자체와는 무관","남성이 우울 척도 문항에 응답을 덜 함(성별로 설명 가능)"],
    ["MNAR (비무작위 결측)","결측이 '결측값 자체' 또는 미관측 변수와 관련","소득이 매우 높은 사람이 소득 문항을 비움"],
  ]],
  ["ul",[
    "MCAR: 삭제해도 편향 없음(단 표본↓). MAR: 다중대치·회귀대치 등으로 처리 가능.",
    "MNAR: 가장 어려움 — 결측 자체를 모델링해야 하며 단순 대치 시 심각한 편향.",
  ]],
  ["exam",["MAR의 핵심 = '관측된 다른 변수와는 연관, 비관측값(자기 자신)과는 무관'. MNAR과의 경계 문장 빈출."]],
]},

{id:"c202", s:2, c:"2-1-1", t:"결측치 처리 — 단순 대치법 vs 다중 대치법", tag:["개념","비교"], b:[
  ["table",["방법","설명","한계"],[
    ["완전 분석법(목록별 삭제)","결측이 하나라도 있는 행 전체 제거","표본 크게 감소, MCAR 아니면 편향"],
    ["평균 대치법","해당 변수의 평균(또는 중앙값)으로 채움","분산 과소추정, 상관관계 왜곡"],
    ["회귀 대치법","다른 변수로 회귀식을 만들어 예측값으로 채움","관계를 인위적으로 강화"],
    ["단순확률 대치법","회귀 예측값 + 랜덤 오차항을 더해 채움","평균대치의 분산 축소를 일부 보정"],
    ["최근접 대치(Hot-deck)","가장 유사한 관측치의 값을 가져와 채움","유사도 기준에 민감"],
  ]],
  ["h","다중 대치법 (Multiple Imputation)"],
  ["steps","3단계",[
    "**대치(Imputation)**: 서로 다른 대치값으로 완성한 데이터셋을 m개 생성.",
    "**분석(Analysis)**: m개 데이터셋 각각에 동일 분석을 수행.",
    "**결합(Pooling)**: m개 결과를 규칙(Rubin's rule)으로 통합해 불확실성까지 반영.",
  ]],
  ["exam",["다중대치는 '단순대치를 복수로 시행해 통계적 효율성·일치성을 보완'. 3단계(대치-분석-결합) 순서."]],
]},

{id:"c203", s:2, c:"2-1-1", t:"이상치 개념과 탐지 기법", tag:["개념","원리"], b:[
  ["p","**이상치(outlier)**: 데이터의 전반적 패턴에서 크게 벗어난 값. 비무작위로 나타나면 데이터 정상성·신뢰성을 떨어뜨린다. (측정 오류일 수도, 진짜 희귀 현상일 수도 있어 무조건 삭제는 금물)"],
  ["table",["기법","원리"],[
    ["IQR (Tukey)","Q1−1.5·IQR 미만 또는 Q3+1.5·IQR 초과를 이상치로 판정 (상자수염그림)"],
    ["Z-Score","표준화 점수 |z| > 3(또는 2.5)이면 이상치 — 정규분포 가정"],
    ["ESD (Extreme Studentized Deviate)","평균에서 표준편차의 3배 벗어난 값"],
    ["기하평균 ± 2.5σ","기하평균 기준 편차 활용"],
    ["DBSCAN","밀도 기반 군집 후 어느 군집에도 속하지 않는 점(noise)을 이상치로"],
    ["LOF (Local Outlier Factor)","주변 이웃 대비 국소 밀도 비율로 이상 정도를 점수화"],
    ["Isolation Forest","랜덤 분할 트리에서 더 빨리 고립되는(경로 짧은) 점이 이상치"],
  ]],
  ["exam",[
    "IQR 계수 1.5, Z-Score 임계값 3 — 숫자 그대로 출제.",
    "'고립 의사나무(Isolation Forest)' = 적은 분할로 고립되면 이상치. '밀도 기반' = DBSCAN/LOF.",
  ]],
]},

{id:"c204", s:2, c:"2-1-2", t:"변수 선택법 — 전진선택·후진소거·단계적", tag:["개념","비교","빈출"], b:[
  ["p","설명력을 유지하면서 변수 개수를 줄이면 **효율성↑·과적합↓·해석 용이**. 대표적 3가지 탐색 전략."],
  ["table",["방법","진행","특징"],[
    ["전진 선택법","변수가 없는 상태에서 시작 → 종속변수와 상관(기여도)이 가장 큰 변수부터 하나씩 추가","한 번 들어온 변수는 제거하지 않음"],
    ["후진 소거법","모든 변수를 넣은 상태에서 시작 → 기여도가 가장 낮은 변수부터 하나씩 제거","한 번 빠진 변수는 다시 넣지 않음, 변수 많으면 계산 부담"],
    ["단계적 선택법","전진 선택으로 변수를 넣되, 추가할 때마다 기존 변수의 유의성을 재검토해 유의하지 않으면 제거","전진+후진 결합, 가장 널리 사용"],
  ]],
  ["ul",["선택 기준: p-value, AIC/BIC, 수정된 R², F 통계량 등"]],
  ["exam",["'한번 추가된 변수는 제거하지 않음' = 전진선택. '넣고 나서 다시 검토·제거' = 단계적. 지문 그대로 매칭."]],
]},

{id:"c205", s:2, c:"2-1-2", t:"차원 축소와 차원의 저주", tag:["개념","원리"], b:[
  ["p","**차원의 저주**: 변수(차원)가 늘어날수록 같은 밀도를 유지하는 데 필요한 데이터가 기하급수적으로 증가한다. 학습 데이터 수가 차원보다 적어지면 공간이 희소해져 거리 개념이 무의미해지고 성능이 급락한다."],
  ["ul",["해결: 차원을 줄이거나(차원 축소·변수 선택) 데이터 수를 늘린다."]],
  ["h","차원 축소의 이점"],
  ["ul",[
    "복잡도↓ → 분석 시간·저장 공간 절약",
    "과적합 가능성↓ → 일반화 성능 보호",
    "시각화·해석 용이 (2~3차원으로 투영)",
    "다중공선성 완화",
  ]],
  ["h","변수 선택 vs 변수 추출"],
  ["ul",[
    "**변수 선택(Selection)**: 원래 변수 중 일부를 고름 → 해석 유지.",
    "**변수 추출(Extraction)**: 원 변수들을 조합해 새 변수(주성분 등) 생성 → 해석 어려움, 정보 손실 최소화.",
  ]],
]},

{id:"c206", s:2, c:"2-1-2", t:"주성분 분석(PCA)의 작동 원리", tag:["원리","빈출"], b:[
  ["p","**PCA**는 데이터의 분산을 가장 잘 설명하는 새로운 직교 축(주성분)을 찾아 그 축으로 데이터를 투영해 차원을 줄이는 **비지도** 기법이다."],
  ["steps","계산 절차",[
    "각 변수를 **표준화**(평균 0, 분산 1) — 단위 영향 제거.",
    "변수들의 **공분산 행렬**(또는 상관행렬)을 계산.",
    "공분산 행렬의 **고유값(eigenvalue)과 고유벡터(eigenvector)**를 구함.",
    "고유값이 큰 순서로 고유벡터를 정렬 → 고유벡터 = 주성분 축, 고유값 = 그 축이 설명하는 분산량.",
    "누적 기여율(설명 분산 비율)이 충분한(예: 80~90%) 상위 k개 주성분만 선택.",
    "원 데이터를 k개 주성분 축에 투영해 차원 축소된 좌표를 얻음.",
  ]],
  ["ul",[
    "제1주성분 = 분산이 최대인 방향, 제2주성분 = 제1주성분과 **직교**하면서 남은 분산이 최대인 방향.",
    "주성분 개수 결정: 누적 기여율, **스크리 도표(Scree plot)의 팔꿈치**, 고유값 > 1(Kaiser 기준).",
  ]],
  ["why","다중공선성이 심한 회귀에서 PCA로 만든 주성분을 설명변수로 쓰면(주성분 회귀) 계수 추정이 안정된다. 다만 주성분은 원 변수의 선형결합이라 '이 변수가 매출에 +영향' 같은 해석이 사라지는 것이 대가다."],
  ["exam",["'분산을 최대한 보존하는 축', '공분산 행렬의 고유값 분해', '주성분끼리 직교' — 3개 키워드가 정답 문장."]],
]},

{id:"c207", s:2, c:"2-1-2", t:"SVD·요인분석·NMF — 그 밖의 변수 축약", tag:["개념","비교"], b:[
  ["table",["기법","핵심"],[
    ["요인분석 (Factor Analysis)","관측 변수들 뒤에 숨은 공통 잠재요인을 추정. 독립/종속 구분 없음. 탐색적(EFA)·확인적(CFA)"],
    ["주성분분석 (PCA)","분산 최대 방향의 성분 추출. 요인분석과 달리 '오차'를 따로 두지 않음"],
    ["특이값 분해 (SVD)","임의의 행렬 A = UΣVᵀ 로 분해. 상위 특이값만 남겨 원 행렬을 근사(저차원 재구성). 추천시스템·LSA에 활용"],
    ["음수 미포함 행렬분해 (NMF)","V ≈ W·H, 모든 원소가 음수가 아님. 부분 기반 표현(토픽·부품)에 유리, 정확한 해가 없어 근사해를 구함"],
  ]],
  ["exam",["'음수를 포함하지 않는 행렬 V를 W와 H의 곱으로 분해' = NMF. 'UΣVᵀ' = SVD. 요인분석은 '공통요인으로 축약, 독립·종속 개념 없음'."]],
]},

{id:"c208", s:2, c:"2-1-2", t:"파생변수와 요약변수", tag:["개념","비교"], b:[
  ["table",["구분","정의","예"],[
    ["파생변수 (Derived)","특정 조건이나 함수로 새로 만들어 의미를 부여한 변수. 주관적일 수 있어 논리적 근거 필요","생년월일→나이, 구매일시→'주말 여부', 키·몸무게→BMI"],
    ["요약변수 (Summary)","원 데이터를 분석 목적에 맞게 집계·요약한 변수. 재활용성이 높음","고객별 최근 3개월 총구매액, 방문 횟수, 평균 체류시간"],
  ]],
  ["exam",["'수집된 정보를 분석에 맞게 종합' = 요약변수. '조건/함수로 새 의미 부여' = 파생변수."]],
]},

{id:"c209", s:2, c:"2-1-2", t:"변수 변환과 스케일링 — 정규화·표준화·비선형 변환", tag:["개념","비교","빈출"], b:[
  ["table",["방법","식","용도"],[
    ["최소-최대 정규화","(x − min) / (max − min) → [0, 1]","범위를 통일, 이상치에 민감"],
    ["Z-Score 표준화","(x − μ) / σ → 평균 0·표준편차 1","정규분포 가정 기법, 이상치에 덜 민감"],
    ["로그 변환","log(x)","오른쪽으로 심하게 치우친(양의 왜도) 분포를 대칭에 가깝게"],
    ["제곱근 변환","√x","카운트·포아송형 데이터의 분산 안정화"],
    ["역수 변환","1/x","특정 비율·속도 데이터"],
    ["Box-Cox 변환","λ에 따라 로그~거듭제곱을 연속적으로","정규성에 가장 가깝게 만드는 λ를 탐색"],
    ["구간화(Binning)","연속형 → 범주형 구간","비선형 관계 포착, 이상치 영향 완화"],
    ["원-핫 인코딩","범주형 → 0/1 더미변수","트리 외 대부분 모델이 범주형을 직접 못 받음"],
  ]],
  ["exam",[
    "min-max = '범위를 0~1로', z-score = '평균 0·분산 1'. 둘을 바꿔 내는 함정.",
    "'양의 왜도(오른쪽 꼬리) 완화' = 로그 변환.",
    "표준화는 거리 기반(KNN·SVM·K-means)·경사하강 기반 모델에서 필수, 트리 계열은 불필요.",
  ]],
]},

{id:"c210", s:2, c:"2-1-2", t:"클래스 불균형 처리 — 언더·오버샘플링·SMOTE", tag:["개념","비교"], b:[
  ["p","**클래스 불균형**: 목표 범주 간 데이터 양 차이가 큰 상태(사기 탐지 0.1% 등). 다수 클래스에 편향돼 소수 클래스를 거의 못 맞히면서 정확도만 높게 나온다."],
  ["table",["방법","내용","부작용"],[
    ["언더샘플링","다수 클래스에서 일부만 골라 수를 줄임","정보 손실(버려지는 데이터)"],
    ["오버샘플링","소수 클래스를 복제해 수를 늘림","동일 데이터 반복 → 과적합"],
    ["SMOTE","소수 클래스 샘플과 그 최근접 이웃 사이를 보간해 '합성' 샘플 생성","경계가 겹치면 노이즈 생성 (Borderline-SMOTE, ADASYN 등 변형)"],
    ["임계값 이동 / 비용민감 학습","분류 기준 확률을 조정하거나 소수 클래스 오분류에 큰 페널티","데이터는 그대로, 모델·평가만 조정"],
  ]],
  ["exam",[
    "'소수 클래스 복사본을 만든다' = 오버샘플링. 'SMOTE = 합성(보간)'이지 단순 복제가 아님.",
    "불균형에서 평가지표는 정확도 대신 **F1·재현율·PR-AUC** 사용.",
  ]],
]},

{id:"c211", s:2, c:"2-2-1", t:"탐색적 데이터 분석(EDA)의 4가지 주제", tag:["개념"], b:[
  ["p","**EDA**(Tukey): 본격 분석·모델링 전에 그래프와 요약통계로 데이터를 직관적으로 통찰하는 과정. 숨은 문제를 인식하고 새로운 패턴·가설을 발견한다."],
  ["table",["주제","의미"],[
    ["저항성(Resistance)","일부 이상치·오류에 크게 흔들리지 않는 통계(중앙값·IQR)를 선호"],
    ["잔차 해석(Residual)","데이터에서 주요 패턴을 뺀 나머지를 살펴 설명되지 않는 부분을 탐색"],
    ["자료 재표현(Re-expression)","로그·제곱근 등으로 척도를 바꿔 분포를 대칭·선형에 가깝게"],
    ["현시성(Graphical Representation)","그래프로 데이터를 드러내 패턴을 즉각 파악"],
  ]],
  ["exam",["4주제(저항성·잔차·재표현·현시성) 이름 나열형 출제. '평균보다 중앙값 선호' = 저항성."]],
]},

{id:"c212", s:2, c:"2-3-1", t:"기초통계량 — 중심 경향과 산포", tag:["개념","계산"], b:[
  ["h","중심 경향"],
  ["table",["통계량","정의","특징"],[
    ["산술평균","합 / n","모든 값 반영, 이상치에 민감"],
    ["기하평균","(x₁·x₂·…·xₙ)^(1/n)","비율·성장률의 평균에 사용"],
    ["조화평균","n / Σ(1/xᵢ)","속도·평균 단가"],
    ["중앙값","크기순 가운데 값","이상치에 강함(저항성)"],
    ["최빈값","가장 자주 나오는 값","범주형에도 사용"],
  ]],
  ["h","산포도"],
  ["ul",[
    "**분산** = 편차 제곱의 평균. **표준편차** = √분산 (원 단위 복원).",
    "**모분산** σ² = Σ(xᵢ−μ)²/N, **표본분산** s² = Σ(xᵢ−x̄)²/(n−1) — 분모가 n−1(자유도).",
    "**범위** = 최댓값−최솟값, **사분위범위(IQR)** = Q3−Q1.",
    "**변동계수(CV)** = 표준편차/평균 — 단위·평균이 다른 집단의 산포 비교.",
    "**평균절대편차(MAD)** = |편차|의 평균.",
  ]],
  ["exam",["표본분산 분모가 n−1인 이유 = 불편추정량(자유도 손실 보정). 좌로 치우친(음의 왜도) 분포: 평균<중앙값<최빈값."]],
]},

{id:"c213", s:2, c:"2-3-1", t:"분포의 형태 — 왜도와 첨도", tag:["개념"], b:[
  ["h","왜도(Skewness) — 비대칭의 방향·정도"],
  ["table",["왜도","분포 모양","대푯값 관계"],[
    ["= 0","좌우 대칭 (정규분포 등)","평균 = 중앙값 = 최빈값"],
    ["> 0 (양의 왜도)","오른쪽 꼬리가 긴 우편향","최빈값 ≤ 중앙값 ≤ 평균"],
    ["< 0 (음의 왜도)","왼쪽 꼬리가 긴 좌편향","평균 ≤ 중앙값 ≤ 최빈값"],
  ]],
  ["h","첨도(Kurtosis) — 꼬리의 두께와 봉우리의 뾰족함"],
  ["table",["첨도","(초과첨도)","형태"],[
    ["= 3","0","정규분포 (mesokurtic)"],
    ["> 3","양수","봉우리가 뾰족하고 꼬리가 두꺼움 = 급첨 (leptokurtic) — 극단값 확률↑"],
    ["< 3","음수","봉우리가 완만하고 꼬리가 얇음 = 완첨 (platykurtic)"],
  ]],
  ["ul",[
    "정의상 첨도의 기준값은 **3**이나, 통계 패키지는 대개 3을 빼서 정규분포가 0이 되는 **초과첨도(excess kurtosis)**를 출력한다.",
    "양의 왜도 데이터(소득·집값·대기시간 등 하한은 있고 상한이 큼)는 로그 변환의 대표 대상.",
  ]],
  ["exam",["양의 왜도 ⇒ 오른쪽 꼬리 ⇒ 평균 > 중앙값. 첨도 3 초과 = 급첨(꼬리 두꺼움)."]],
]},

{id:"c214", s:2, c:"2-2-1", t:"상관분석 — 피어슨·스피어만·켄달과 기본 가정", tag:["개념","비교","빈출"], b:[
  ["table",["계수","대상 척도","측정 대상"],[
    ["피어슨 (r)","등간·비율(연속형)","두 변수의 '선형' 관계 강도·방향"],
    ["스피어만 (ρ)","순위(서열)","값 대신 순위를 매겨 '단조' 관계 — 비선형·이상치에 강함"],
    ["켄달 (τ)","순위(서열)","concordant/discordant 쌍의 비율, 표본이 작을 때 안정적"],
  ]],
  ["ul",[
    "상관계수 범위 **−1 ≤ r ≤ +1**. +1 완벽한 양의 선형, 0 선형관계 없음, −1 완벽한 음의 선형.",
    "**상관 ≠ 인과**. r이 0이어도 곡선(비선형) 관계는 존재할 수 있음.",
  ]],
  ["h","피어슨 상관분석의 기본 가정"],
  ["ul",["선형성 · 등분산성(동변량성, X와 무관하게 Y의 흩어짐 일정) · 두 변수의 정규분포성 · 무선 독립 표본"]],
  ["exam",["'순위로 계산' = 스피어만/켄달. 등분산성의 반대말 = 이분산성. 피어슨 가정 4가지."]],
]},

{id:"c215", s:2, c:"2-2-1", t:"공분산 vs 상관계수", tag:["개념","비교"], b:[
  ["formula","Cov(X,Y) = E[(X−μₓ)(Y−μᵧ)]",  "부호는 관계 방향을 주지만 크기는 변수 단위에 좌우돼 강도 비교 불가"],
  ["formula","r = Cov(X,Y) / (σₓ · σᵧ)",  "공분산을 각 표준편차로 나눠 −1~+1로 표준화한 값"],
  ["ul",[
    "공분산: 단위 있음(예: cm·kg), 범위 제한 없음.",
    "상관계수: 무단위, −1~+1, 서로 다른 변수쌍의 관계 강도를 비교 가능.",
  ]],
  ["exam",["'상관계수 = 공분산을 표준편차의 곱으로 나눈 것' — 정의식 그대로 출제."]],
]},

{id:"c216", s:2, c:"2-3-1", t:"확률 표본추출 기법 4가지", tag:["개념","비교","빈출"], b:[
  ["table",["기법","방법","포인트"],[
    ["단순무작위추출","모든 표본이 뽑힐 확률이 동일하게 무작위 추출","가장 기본, 난수·제비뽑기"],
    ["계통추출","모집단을 정렬 후 추출 간격 k를 정해 매 k번째를 뽑음","시작점만 무작위, 주기성 있으면 편향"],
    ["층화추출","모집단을 겹치지 않는 '동질적' 층으로 나눈 뒤 각 층에서 무작위 추출","층 내 동질·층 간 이질, 정밀도↑ (비례·불비례)"],
    ["군집추출","모집단을 '이질적' 군집으로 나눈 뒤 일부 군집을 통째로 조사","군집 내 이질·군집 간 동질, 비용↓ 대신 오차↑"],
  ]],
  ["ul",[
    "**층화 vs 군집**: 층화는 '층에서 조금씩', 군집은 '몇몇 군집을 전부'. 동질/이질 방향이 반대.",
    "비확률추출: 편의·판단·할당·눈덩이 표집 (일반화 어려움).",
  ]],
  ["exam",["'추출 간격 설정' = 계통. '층별 임의추출' = 층화. '군집 단위 일부/전체 조사' = 군집. 동질·이질 방향 함정 빈출."]],
]},

{id:"c217", s:2, c:"2-3-1", t:"조건부 확률과 베이즈 정리", tag:["원리","계산","빈출"], b:[
  ["formula","P(A|B) = P(A∩B) / P(B)",  "사건 B가 일어났을 때 A가 일어날 조건부 확률"],
  ["formula","P(A∩B) = P(A)·P(B|A) = P(B)·P(A|B)",  "곱셈법칙. A와 B가 독립이면 P(A∩B) = P(A)·P(B)"],
  ["formula","P(Aⱼ|B) = P(B|Aⱼ)P(Aⱼ) / Σᵢ P(B|Aᵢ)P(Aᵢ)",  "베이즈 정리 — 사전확률 P(Aⱼ)를 관측 B로 갱신해 사후확률을 구함"],
  ["h","용어"],
  ["ul",[
    "**사전확률(prior)**: 데이터를 보기 전의 믿음 P(A).",
    "**우도(likelihood)**: 원인 A에서 결과 B가 나올 확률 P(B|A).",
    "**사후확률(posterior)**: 데이터를 본 후 갱신된 믿음 P(A|B).",
    "분모 P(B) = 전체 확률의 법칙으로 계산하는 정규화 상수(evidence).",
  ]],
  ["why","베이즈 정리는 스팸 필터, 의료 진단(민감도·특이도로 실제 양성 확률 계산), A/B 테스트, 나이브 베이즈 분류의 뼈대다. '희귀병 검사 양성일 때 실제 병일 확률' 문제는 반드시 나온다 — 유병률(사전확률)이 낮으면 양성이어도 실제 확률이 낮다."],
  ["exam",["2×2 표(질병 유무 × 검사 결과)를 주고 P(질병|양성)을 계산하는 문제 최빈출."]],
]},

{id:"c218", s:2, c:"2-3-1", t:"이산확률분포 총정리 — 베르누이부터 초기하까지", tag:["개념","비교","빈출"], b:[
  ["p","모두 **베르누이 시행**(성공확률 p, 실패확률 q=1−p, 결과 2가지)에서 파생된다. '무엇을 세는가'가 분포를 가른다."],
  ["table",["분포","세는 대상","기댓값 E(X)","분산 Var(X)"],[
    ["베르누이(p)","1회 시행의 성공 여부 (0 또는 1)","p","pq"],
    ["이항 B(n, p)","독립 시행 n회 중 성공 횟수","np","npq"],
    ["포아송 Pois(λ)","단위 시간·공간당 희귀 사건의 발생 횟수","λ","λ (평균=분산)"],
    ["기하(p)","첫 성공이 나올 때까지의 시행 횟수","1/p","q/p²"],
    ["음이항(k, p)","k번째 성공이 나올 때까지의 시행 횟수","k/p","kq/p²"],
    ["초기하(N, K, n)","크기 N(성공요소 K개)에서 비복원으로 n개 뽑을 때 성공 개수","nK/N","—"],
    ["다항","각 시행이 범주 k개 중 하나일 때 각 범주의 횟수","npᵢ","—"],
  ]],
  ["ul",[
    "**이항 → 포아송 근사**: n이 크고 p가 작을 때 (λ = np).",
    "**이항 → 정규 근사**: n이 충분히 크고 np, nq ≥ 5 (평균 np, 분산 npq).",
    "**초기하 vs 이항**: 비복원 추출은 초기하, 복원 추출 또는 모집단이 매우 커서 비복원 효과가 무시될 때는 이항.",
    "기하·음이항은 '**시행 횟수**'를 세는 분포 — 이산이지만 무한한 값을 가질 수 있음.",
  ]],
  ["exam",["'단위 시간당 발생 횟수' = 포아송(E=Var=λ). '첫 성공까지' = 기하(E=1/p). '비복원' = 초기하. 이항의 분산 = npq."]],
]},

{id:"c219", s:2, c:"2-3-1", t:"연속확률분포와 분포 간의 관계", tag:["개념","비교"], b:[
  ["table",["분포","용도"],[
    ["연속균등","구간 [a,b]에서 확률밀도가 일정"],
    ["정규 N(μ,σ²)","자연·사회 현상의 기본 분포, 종모양·평균 대칭"],
    ["표준정규 N(0,1)","정규분포를 Z=(X−μ)/σ로 표준화"],
    ["지수","포아송 과정에서 '한' 사건이 발생할 때까지의 대기 시간, 무기억성"],
    ["감마","포아송 과정에서 'k개' 사건이 발생할 때까지의 대기 시간"],
    ["카이제곱 χ²(k)","독립 표준정규 k개를 제곱해 합한 분포, 분산 추론·적합도·독립성 검정"],
    ["t(ν)","모분산을 모를 때 정규 모집단의 평균 추론, 종모양·0 대칭·정규보다 꼬리 두꺼움"],
    ["F(k₁,k₂)","두 카이제곱을 각 자유도로 나눈 비, 분산비 검정·분산분석(ANOVA)"],
  ]],
  ["ul",[
    "Z² ~ χ²(1) · 카이제곱의 합도 카이제곱 · t는 ν→∞에서 표준정규로 수렴 · F(1,k) = t(k)².",
    "지수분포는 감마분포의 특수형(k=1).",
  ]],
  ["exam",["'포아송 과정에서 한 사건까지 대기시간' = 지수. 'k개까지' = 감마. t분포는 '자유도가 커지면 정규분포에 근접'."]],
]},

{id:"c220", s:2, c:"2-3-1", t:"표본분포·표준오차·중심극한정리", tag:["원리","빈출"], b:[
  ["ul",[
    "**표본분포**: 크기 n인 표본에서 계산한 통계량(예: 표본평균)의 확률분포.",
    "**표준오차(SE)**: 표본평균의 표준편차 = σ/√n (모집단 무한). 표본이 클수록 SE↓ → 추정이 정밀.",
  ]],
  ["formula","X̄ ~ N(μ, σ²/n)  (n이 충분히 크면 모집단 분포와 무관)",  "중심극한정리(CLT): 모집단이 어떤 분포든 표본평균의 분포는 정규분포에 근접 (보통 n ≥ 30)"],
  ["why","CLT 덕분에 모집단 분포를 몰라도 표본평균으로 Z·t 검정을 할 수 있다. 여론조사 '표본오차 ±3%p'도 SE에서 나온 것 — 표본을 4배 늘려야 오차가 절반이 된다(√n)."],
  ["exam",["표준오차 공식 σ/√n. 'n을 4배로 하면 표준오차는 1/2' 같은 계산. CLT는 '모집단 분포와 무관'이 핵심."]],
]},

{id:"c221", s:2, c:"2-3-2", t:"점추정과 좋은 추정량의 4가지 성질", tag:["개념","빈출"], b:[
  ["table",["성질","의미"],[
    ["불편성 (Unbiasedness)","추정량의 기댓값 = 모수. 편향(bias) = E(θ̂) − θ = 0"],
    ["효율성 (Efficiency)","불편추정량 중 분산이 가장 작음"],
    ["일치성 (Consistency)","표본이 커질수록 추정량이 모수에 확률적으로 수렴"],
    ["충분성 (Sufficiency)","표본이 가진 모수에 대한 정보를 모두 담고 있음"],
  ]],
  ["h","최대우도추정(MLE)"],
  ["ul",[
    "관측된 표본이 나올 **우도(likelihood)를 최대로** 만드는 모수값 θ̂ 을 택함.",
    "보통 로그우도를 미분해 0이 되는 지점을 찾음. 대표본에서 일치성·점근적 정규성·효율성을 가짐.",
  ]],
  ["exam",["'편향이 0이면 불편추정량'. 표본분산에서 n−1로 나누는 이유가 불편성. MLE = '표본을 얻을 확률(우도)이 가장 높은 모수'."]],
]},

{id:"c222", s:2, c:"2-3-2", t:"구간추정과 신뢰구간의 올바른 해석", tag:["개념","계산","빈출"], b:[
  ["p","**구간추정**: 점추정에 오차를 더해 '모수가 이 구간에 있을 것'이라고 신뢰수준과 함께 제시."],
  ["table",["상황","모평균 신뢰구간"],[
    ["모분산 σ² 을 앎","X̄ ± Z(α/2) · σ/√n"],
    ["모분산 모름 · 소표본 · 정규모집단","X̄ ± t(α/2, n−1) · S/√n"],
    ["모분산 모름 · 대표본","X̄ ± Z(α/2) · S/√n (t≈Z)"],
  ]],
  ["ul",[
    "**신뢰수준 95%의 의미**: 같은 방식으로 표본추출·구간계산을 반복하면 그중 약 95%가 참 모수를 포함한다. (특정 한 구간이 모수를 포함할 확률이 95%라는 뜻이 아님)",
    "신뢰수준↑ → 구간 넓어짐 / 표본크기↑ → 구간 좁아짐.",
  ]],
  ["exam",["σ 알면 Z, 모르면 t(자유도 n−1). 신뢰수준을 높이면 신뢰구간 폭이 넓어진다(정밀도↓)."]],
]},

{id:"c223", s:2, c:"2-3-2", t:"가설검정 — 귀무·대립가설, 1종·2종 오류, 검정력", tag:["원리","빈출"], b:[
  ["ul",[
    "**귀무가설 H₀**: 기존 통념·차이 없음(=). **대립가설 H₁**: 연구자가 입증하려는 새 주장(≠, <, >).",
    "검정은 H₀를 '기각' 또는 '기각하지 못함'으로 판정 — '채택'이라 하지 않는다(증명이 아니라 반증 실패).",
  ]],
  ["table",["실제 상황 → / 판정 ↓","H₀ 이 참","H₀ 이 거짓"],[
    ["H₀ 기각 못함","옳은 결정 (신뢰수준 1−α)","제2종 오류 (β)"],
    ["H₀ 기각","제1종 오류 (α)","옳은 결정 (검정력 1−β)"],
  ]],
  ["ul",[
    "**제1종 오류(α)**: 참인 H₀를 기각 (없는 효과를 있다고 함). 유의수준 = 허용 최대치.",
    "**제2종 오류(β)**: 거짓인 H₀를 기각 못함 (있는 효과를 놓침).",
    "**검정력(1−β)**: 참 효과를 탐지할 확률. 표본크기↑·효과크기↑·α↑ → 검정력↑.",
    "α와 β는 표본크기가 고정이면 상충 — α를 낮추면 β는 커진다.",
  ]],
  ["h","p-value"],
  ["p","H₀가 참이라는 가정하에, 관측된 것만큼 또는 더 극단적인 결과가 나올 확률. **p < α 이면 H₀ 기각.** p-value는 '귀무가설을 기각하기 위해 필요한 최소 유의수준'으로도 정의된다."],
  ["exam",["1종 오류=α=참 H₀ 기각, 2종 오류=β=거짓 H₀ 채택. 검정력=1−β. p<유의수준 → 기각. '채택'이란 표현 함정."]],
]},

{id:"c224", s:2, c:"2-3-2", t:"검정통계량의 선택 — Z·t·χ²·F와 양측·단측", tag:["개념","비교","빈출"], b:[
  ["table",["검정 상황","검정통계량"],[
    ["모평균, σ 앎 / 대표본","Z = (X̄−μ) / (σ/√n)"],
    ["모평균, σ 모름 / 소표본·정규","t = (X̄−μ) / (S/√n), 자유도 n−1"],
    ["두 독립표본 평균 차","합동분산 t 검정 (등분산 가정 시)"],
    ["대응(짝지은) 표본 평균 차","차이 D에 대한 t 검정"],
    ["한 모분산","χ² = (n−1)S² / σ₀²"],
    ["두 모분산 비 (등분산성)","F = S₁² / S₂²"],
    ["범주형 독립성·적합도","χ² = Σ (관측−기대)² / 기대"],
    ["3집단 이상 평균 비교","F 검정 (분산분석 ANOVA)"],
  ]],
  ["ul",[
    "**양측검정**: H₁이 '≠', 기각역이 양쪽 꼬리에 α/2씩.",
    "**단측검정**: H₁이 '<' 또는 '>', 기각역이 한쪽 꼬리에 α 전부 — 같은 α면 단측이 검정력 큼.",
  ]],
  ["exam",["σ 알면 Z, 모르면 t. 분산 검정은 χ²(1개)·F(2개 비교). 대응표본 vs 독립표본 t 구분. 양측은 α/2."]],
]},

{id:"c225", s:2, c:"2-2-2", t:"고급 탐색 — 시공간 데이터와 다변량 분석 지도", tag:["개념","비교"], b:[
  ["ul",[
    "**시간 데이터**: 유효시간·거래시간·사용자정의시간 등 시점 정보를 가진 데이터.",
    "**공간 데이터**: 래스터(격자)·벡터(점·선·면) 모델로 위치·형상 표현.",
    "**시공간 데이터**: 공간 정보 + 시간 흐름이 결합된 다차원 데이터 (이동 경로, 확산).",
  ]],
  ["table",["분석 목적","기법"],[
    ["종속-독립 인과관계","다중회귀, 로지스틱 회귀, 분산분석"],
    ["변수 축약","주성분분석, 요인분석, 정준상관분석"],
    ["개체(대상) 분류·유도","군집분석, 다차원척도법, 판별분석"],
  ]],
  ["exam",["'변수축약 = 변수유도기법(주성분·요인·정준상관)', '개체유도 = 군집·MDS·판별'. 목적별 기법 매칭."]],
]},

{id:"c226", s:2, c:"2-2-2", t:"비정형 데이터 마이닝 — 텍스트·오피니언·웹 마이닝", tag:["개념","비교"], b:[
  ["table",["기법","내용"],[
    ["데이터 마이닝","대용량 데이터에서 통계적 규칙·패턴을 자동으로 추출"],
    ["텍스트 마이닝","자연어 처리로 비정형 텍스트에서 주제·핵심어·의미를 추출 (문서 내 '주제 파악')"],
    ["오피니언 마이닝","텍스트 마이닝의 하위 — 특정 주제에 대한 주관적 의견의 '감정·태도(긍/부정)'를 수치화 (감성 분석)"],
    ["웹 마이닝","웹 로그·구조·콘텐츠를 분석 (웹 사용·구조·내용 마이닝)"],
    ["리얼리티 마이닝","휴대폰·센서 등에서 인간 행동·관계 패턴을 추출"],
  ]],
  ["ul",["**자연어 처리(NLP)**: 인간 언어를 컴퓨터가 이해·생성하도록 하는 AI 분야. 토큰화·형태소분석·구문분석·임베딩 등."]],
  ["exam",["'문장 내 주제 파악 = 텍스트 마이닝 / 감정·태도 판별 = 오피니언 마이닝' — 이 대비 문장 빈출."]],

    ["배깅 (Bagging)","같은 알고리즘을, 서로 다른 부트스트랩 표본으로 병렬 학습","평균(회귀)·다수결 투표(분류)","분산 감소 (예: 랜덤 포레스트)"],
    ["부스팅 (Boosting)","약한 학습기를 순차 학습 — 앞 모델이 틀린 샘플에 가중치를 키움","학습기별 가중 합","편향 감소 (예: AdaBoost, GBM, XGBoost)"],
    ["보팅 (Voting)","서로 다른 종류의 알고리즘을 각각 학습","하드 보팅(다수결)·소프트 보팅(확률 평균)","다양성 활용"],
    ["스태킹 (Stacking)","여러 기반 모델(base learner)의 예측값을 새 입력 특징으로 사용","그 위에 메타 모델(meta learner)이 최종 예측을 학습","기반 모델들의 장점 조합"],
  ]],
  ["exam",[
    "배깅 = 병렬 학습·분산↓ / 부스팅 = 순차 학습·편향↓·병렬화 어려움 / 스태킹 = 예측값을 입력으로 메타 모델이 재학습.",
    "**주의**: '같은 알고리즘에 다른 표본 조합을 여러 번 뽑아 학습·집계'는 스태킹이 아니라 **배깅**이다(일부 요약서의 오류). 랜덤 포레스트는 배깅에 속한다.",
  ]],
]},
{id:"c309", s:3, c:"3-2-1", t:"배깅과 랜덤 포레스트", tag:["원리","빈출"], b:[
  ["ul",[
    "**부트스트래핑**: 원본에서 중복을 허용해(복원추출) 같은 크기의 표본을 여러 개 생성. 한 표본에 평균 약 63.2%의 원 데이터가 포함됨.",
    "**배깅(Bootstrap Aggregating)**: 각 부트스트랩 표본으로 모델을 학습해 회귀는 평균, 분류는 다수결로 집계.",
    "**OOB(Out-Of-Bag) 오차**: 각 표본에 뽑히지 않은 약 36.8%로 검증 → 별도 검증셋 없이 성능 추정.",
  ]],
  ["h","랜덤 포레스트 = 배깅 + 특성 무작위성"],
  ["ul",[
    "각 노드 분리 시 전체 변수 중 무작위로 뽑은 일부(√p 또는 p/3)만 후보로 사용 → 나무들 간 상관을 낮춰 분산을 더 줄임.",
    "변수 중요도(불순도 감소량, permutation importance) 산출 가능.",
    "과적합에 강하고 튜닝 부담이 적음. 다만 해석성은 단일 트리보다 떨어짐.",
  ]],
  ["exam",["랜덤포레스트의 두 가지 무작위성 = ①부트스트랩 샘플 ②노드마다 변수 부분집합. OOB로 검증 가능."]],
]},
{id:"c310", s:3, c:"3-2-2", t:"부스팅 계열 — AdaBoost·GBM·XGBoost", tag:["원리","비교"], b:[
  ["table",["알고리즘","핵심 아이디어"],[
    ["AdaBoost","오분류된 샘플의 가중치를 높여 다음 약분류기가 집중하게 함. 최종은 분류기별 성능 가중 결합"],
    ["GBM (Gradient Boosting)","이전 모델의 잔차(음의 그래디언트)를 새 트리가 학습하며 순차적으로 오차를 줄임"],
    ["XGBoost","GBM + 정규화항, 2차 근사, 결측 자동처리, 병렬 분할탐색 → 빠르고 과적합에 강함"],
    ["LightGBM","리프 중심(leaf-wise) 성장 + 히스토그램 기반 → 대용량에서 매우 빠름"],
    ["CatBoost","범주형 변수 자동 인코딩(순서형 타깃통계), 대칭 트리"],
  ]],
  ["ul",["부스팅은 강력하지만 이상치·노이즈에 민감하고 학습률(learning rate)·트리 수·깊이 튜닝이 중요."]],
  ["exam",["'가중치를 높여 약분류기를 강분류기로' = 부스팅. GBM은 '잔차를 학습'. 순차 학습이라 배깅보다 병렬화가 어렵다."]],
]},
{id:"c311", s:3, c:"3-2-1", t:"인공신경망 — 퍼셉트론과 순전파", tag:["원리","빈출"], b:[
  ["p","**인공신경망(ANN)**: 뉴런(노드)들이 가중치로 연결된 층 구조. 각 뉴런은 입력의 가중합에 **활성함수**를 적용해 출력한다. 은닉층이 2개 이상이면 **심층 신경망(DNN)**."],
  ["formula","z = Σ(wᵢxᵢ) + b ,   a = f(z)",  "w=가중치(연결계수), b=편향(bias), f=활성함수. 순전파는 입력층→출력층으로 이 계산을 반복"],
  ["ul",[
    "**단층 퍼셉트론**: 선형 분리만 가능 → XOR 문제를 못 풂.",
    "**다층 퍼셉트론(MLP)**: 은닉층 + 비선형 활성함수로 XOR 등 비선형 문제 해결.",
    "학습 3단계: ①미니배치 추출 → ②가중치에 대한 손실의 기울기 산출(역전파) → ③기울기 반대 방향으로 매개변수 갱신.",
  ]],
  ["exam",["단층 퍼셉트론의 한계 = XOR(비선형) 분리 불가. 은닉층+비선형 활성함수로 극복. 가중치=연결계수, 편향=bias."]],
]},
{id:"c312", s:3, c:"3-2-1", t:"오차역전파와 경사하강법", tag:["원리","빈출"], b:[
  ["p","**경사하강법(Gradient Descent)**: 손실함수 L의 기울기(gradient)를 구해, 기울기 반대 방향으로 파라미터를 조금씩(학습률 η만큼) 이동시켜 L의 최소점을 찾는다."],
  ["formula","w ← w − η · ∂L/∂w",  "η(학습률): 너무 크면 발산·진동, 너무 작으면 수렴이 느림"],
  ["h","역전파(Backpropagation)"],
  ["ul",[
    "출력층의 오차를 **연쇄법칙(chain rule)**으로 입력층 방향으로 되돌리며 각 가중치의 기울기 ∂L/∂w 를 효율적으로 계산.",
    "수치미분을 층마다 하면 O(n²)로 느리지만, 역전파는 한 번의 순전파+역전파로 모든 기울기를 O(n)에 계산.",
  ]],
  ["table",["경사하강 방식","1회 갱신에 쓰는 데이터"],[
    ["배치 GD","전체 데이터 — 안정적이나 느리고 메모리 부담"],
    ["확률적 GD (SGD)","1개 샘플 — 빠르고 지역최소 탈출 유리, 진동 큼"],
    ["미니배치 GD","작은 묶음(32·64·128) — 실무 표준, 병렬연산 효율"],
  ]],
  ["exam",["'출력층→입력층으로 오차 전파, 연쇄법칙 활용' = 역전파. 학습률이 크면 발산, 작으면 학습 시간 증가."]],
]},
{id:"c313", s:3, c:"3-2-1", t:"옵티마이저 — SGD·모멘텀·AdaGrad·RMSProp·Adam", tag:["원리","비교","빈출"], b:[
  ["table",["옵티마이저","아이디어"],[
    ["SGD","기울기 방향으로 일정 학습률만큼 이동"],
    ["모멘텀","이전 이동 방향(속도)을 관성으로 누적 → 진동을 줄이고 가속, 지역최소 탈출"],
    ["NAG","모멘텀으로 미리 가 본 지점에서 기울기를 평가"],
    ["AdaGrad","많이 갱신된 파라미터는 학습률을 줄임(자주 등장하는 특성↓) → 학습이 진행될수록 학습률이 계속 작아지는 단점"],
    ["RMSProp","AdaGrad의 학습률 소멸 문제를 지수이동평균으로 완화"],
    ["Adam","모멘텀(1차 모멘트) + RMSProp(2차 모멘트) 결합. 실무 기본값, 좌우 흔들림이 적음"],
  ]],
  ["exam",["Adam = 모멘텀 + AdaGrad(RMSProp) 결합. AdaGrad = '매개변수별 적응적 학습률', 단점은 학습률이 0에 수렴."]],
]},
{id:"c314", s:3, c:"3-2-1", t:"활성함수와 기울기 소실 문제", tag:["원리","비교","빈출"], b:[
  ["table",["함수","출력 범위","특징 / 한계"],[
    ["계단(step)","0 또는 1","미분 불가, 학습 불가"],
    ["시그모이드","(0, 1)","확률 해석 가능. 양끝에서 기울기≈0 → 층이 깊으면 기울기 소실, 출력이 0 중심 아님"],
    ["tanh","(−1, 1)","0 중심이라 시그모이드보다 유리하나 여전히 포화 문제"],
    ["ReLU","0 또는 z","계산 간단, 양수 구간 기울기 1로 소실 완화 — 은닉층 기본. 음수 입력이 계속되면 'dying ReLU'"],
    ["Leaky ReLU / PReLU","음수도 작은 기울기","dying ReLU 보완"],
    ["소프트맥스","합이 1인 확률 벡터","다중 분류 출력층"],
  ]],
  ["ul",["**기울기 소실(vanishing gradient)**: 역전파 시 작은 미분값이 여러 층에 곱해져 입력층 근처 기울기가 0에 수렴 → 학습 정체. ReLU·배치정규화·잔차연결(ResNet)로 완화."]],
  ["exam",["ReLU = '0 이하는 0, 0 초과는 그대로'. 시그모이드의 문제 = 기울기 소실. 출력층 다중분류 = 소프트맥스, 이진분류 = 시그모이드."]],
]},
{id:"c315", s:3, c:"3-2-1", t:"신경망 과적합 방지 — 가중치 감소·드롭아웃·배치정규화·조기종료", tag:["개념","비교"], b:[
  ["table",["기법","방법"],[
    ["가중치 감소(weight decay)","손실함수에 L2(릿지)·L1(라쏘) 페널티를 더해 큰 가중치를 억제"],
    ["드롭아웃","학습 시 은닉 뉴런을 확률 p로 임의 제거 → 특정 뉴런 의존을 막음. 추론 시엔 전체 뉴런 사용(스케일 보정). 앙상블 효과"],
    ["배치 정규화","각 층의 입력을 미니배치 단위로 정규화 → 학습 안정·가속, 약한 규제 효과"],
    ["조기 종료(early stopping)","검증 손실이 더 이상 줄지 않으면 학습 중단"],
    ["데이터 증강","이미지 회전·크롭·노이즈 등으로 학습 데이터를 인위적으로 늘림"],
  ]],
  ["exam",["드롭아웃 = '은닉층 뉴런을 임의로 삭제하며 학습, 테스트 시 전체 사용'. L1=라쏘, L2=릿지."]],
]},
{id:"c316", s:3, c:"3-2-1", t:"CNN — 합성곱·풀링과 출력 크기 계산", tag:["원리","계산","빈출"], b:[
  ["p","**CNN(합성곱 신경망)**: 이미지의 지역적 특징을 필터로 추출. 합성곱+풀링으로 특징을 뽑는 부분과 완전연결층으로 분류하는 부분으로 구성."],
  ["table",["요소","역할"],[
    ["필터(커널)","이미지를 훑으며 특징(에지·질감)을 검출하는 작은 가중치 행렬. 학습 대상"],
    ["스트라이드","필터가 이동하는 간격. 크면 출력이 작아짐"],
    ["패딩","입력 가장자리를 특정값(0)으로 둘러 출력 크기 축소를 방지"],
    ["특징지도(feature map)","합성곱 결과"],
    ["풀링(pooling)","특징지도를 다운샘플링(최댓값/평균). 위치 변화에 강건, 파라미터 없음"],
  ]],
  ["formula","O = ⌊ (I + 2P − F) / S ⌋ + 1",  "I=입력 크기, F=필터 크기, P=패딩, S=스트라이드, O=출력 크기 (가로·세로 각각)"],
  ["ul",["예: I=5, F=3, P=1, S=1 → O = (5+2−3)/1 + 1 = 5 (크기 유지). P=0, S=2면 O = (5−3)/2+1 = 2."]],
  ["exam",["출력 크기 공식 (I+2P−F)/S + 1 계산 문제 빈출. 풀링은 학습 파라미터가 없고 공간 크기를 줄인다."]],
]},
{id:"c317", s:3, c:"3-2-1", t:"RNN·LSTM·GRU — 순차 데이터 모델", tag:["원리","비교"], b:[
  ["ul",[
    "**RNN**: 은닉 상태를 다음 시점으로 전달해 순서를 기억. 필기·음성·자연어 등 시변 데이터에 사용.",
    "한계: 시퀀스가 길어지면 **장기 의존성**을 학습하지 못함(기울기 소실·폭주).",
  ]],
  ["table",["모델","보완 방법"],[
    ["LSTM","입력·망각·출력 게이트와 셀 상태(cell state)로 오래된 정보를 선택적으로 유지·삭제. 파라미터가 많음"],
    ["GRU","업데이트·리셋 2개 게이트로 LSTM을 간소화 → 파라미터 적고 학습 빠름, 성능은 비슷"],
    ["Seq2Seq / 어텐션 / 트랜스포머","인코더-디코더 + 어텐션으로 병렬화·장문 처리 개선 (RNN 없이도 가능)"],
  ]],
  ["exam",["RNN의 한계 = 장기 의존성(기울기 소실). LSTM = 게이트+셀상태로 '여러 단계를 거쳐도 오래 기억'."]],
]},
{id:"c318", s:3, c:"3-2-1", t:"오토인코더와 GAN", tag:["원리","비교"], b:[
  ["table",["모델","구조","용도"],[
    ["오토인코더","인코더(고차원→저차원 잠재벡터) + 디코더(복원). 입력=출력이 되도록 학습","차원 축소, 특징 추출, 이상 탐지, 노이즈 제거(denoising)"],
    ["GAN","생성자(가짜 생성) vs 판별자(진위 구별)가 적대적으로 경쟁 학습","이미지 생성, 데이터 증강, 초해상도"],
  ]],
  ["ul",[
    "오토인코더는 비지도(입력 자체가 정답). 변형: VAE(확률적 잠재공간), Sparse/Denoising AE.",
    "GAN은 준지도로도 분류되며, 학습이 불안정(mode collapse)할 수 있음.",
  ]],
  ["exam",["'저차원으로 압축했다 다시 고차원으로 복원하며 특징 탐색' = 오토인코더. '생성자와 판별자의 경쟁' = GAN."]],
]},
{id:"c319", s:3, c:"3-2-1", t:"서포트 벡터 머신(SVM) — 마진과 커널 트릭", tag:["원리","빈출"], b:[
  ["p","**SVM**: 두 클래스를 나누는 초평면 중 **마진(margin)을 최대화**하는 것을 찾는다. 마진 = 결정 경계와 가장 가까운 데이터(서포트 벡터) 사이의 거리."],
  ["ul",[
    "**서포트 벡터**: 마진 경계 위에 놓인 소수의 결정적 데이터. 이 점들만으로 초평면이 정해짐.",
    "**하드 마진**: 오분류 불허(선형 분리 가능할 때). **소프트 마진**: 슬랙 변수로 약간의 오분류 허용, 규제 상수 **C**로 조절(C↑ → 오분류에 엄격 → 과적합 위험).",
    "**커널 트릭**: 데이터를 고차원으로 실제 매핑하지 않고 커널함수로 내적만 계산해 비선형 분리. 다항 커널, **RBF(가우시안) 커널**, 시그모이드 커널.",
  ]],
  ["why","고차원·소표본(유전자 데이터 등)에서 강하고 과적합에 비교적 견고하다. 다만 대용량에서 학습이 느리고 확률 출력이 자연스럽지 않으며 커널·C·γ 튜닝이 성능을 좌우한다."],
  ["exam",["마진 최대화, 서포트 벡터=경계에 가장 가까운 점, 커널 트릭=고차원 매핑 없이 비선형 분류. C는 소프트마진 규제."]],
]},
{id:"c320", s:3, c:"3-2-2", t:"KNN과 나이브 베이즈", tag:["원리","비교"], b:[
  ["table",["모델","작동","특징"],[
    ["KNN (k-최근접 이웃)","새 점에서 가장 가까운 k개 이웃의 다수결(분류)·평균(회귀)","게으른 학습(lazy) — 학습 X, 예측 시 계산. k·거리척도·스케일에 민감, 차원의 저주에 취약"],
    ["나이브 베이즈","베이즈 정리 + 모든 특성이 조건부 독립이라는 (순진한) 가정","학습 데이터가 적어도 잘 작동, 계산이 매우 빠름. 스팸 필터·문서 분류에 강함"],
  ]],
  ["ul",["나이브 베이즈 변형: 가우시안(연속형), 다항(카운트/문서), 베르누이(이진 특성)."]],
  ["exam",["KNN = 'lazy learner, 학습 단계 없음, k와 스케일에 민감'. 나이브 베이즈 = '조건부 독립 가정, 소량 데이터에도 효율적'."]],
]},
{id:"c321", s:3, c:"3-2-1", t:"연관 분석 — 지지도·신뢰도·향상도와 Apriori", tag:["원리","계산","빈출"], b:[
  ["p","**연관 분석(장바구니 분석)**: 'A를 산 사람은 B도 산다' 같은 동시 발생 규칙을 찾는 비지도 기법."],
  ["formula","지지도 support(A→B) = P(A∩B)",  "전체 거래 중 A와 B가 함께 나타난 비율. 규칙의 빈도·중요도"],
  ["formula","신뢰도 confidence(A→B) = P(B|A) = P(A∩B) / P(A)",  "A를 산 거래 중 B도 산 비율. 규칙의 신뢰성"],
  ["formula","향상도 lift(A→B) = P(A∩B) / ( P(A)·P(B) ) = confidence / P(B)",  "lift=1 독립(연관 없음), >1 양의 연관(함께 잘 팔림), <1 음의 연관"],
  ["ul",[
    "**Apriori**: '어떤 항목집합이 빈발하면 그 부분집합도 모두 빈발한다'는 성질을 이용해, 최소 지지도 미만 항목집합을 조기에 가지치기.",
    "**FP-Growth**: FP-Tree로 후보 생성 없이 빈발 패턴을 찾아 Apriori보다 빠름.",
  ]],
  ["exam",["세 지표 정의·계산 빈출. lift=1이면 두 품목이 독립. Apriori의 원리 = 빈발항목집합의 부분집합도 빈발."]],
]},
{id:"c322", s:3, c:"3-2-1", t:"K-평균 군집 — 작동 원리와 한계", tag:["원리","빈출"], b:[
  ["steps","K-means 알고리즘",[
    "군집 수 **k를 지정**하고 초기 중심점 k개를 (무작위로) 배치.",
    "각 데이터를 **가장 가까운 중심**에 할당.",
    "각 군집에 속한 점들의 **평균으로 중심을 갱신**.",
    "할당이 더 이상 바뀌지 않을 때까지(수렴) 2~3 반복.",
  ]],
  ["ul",[
    "목적함수: **군집 내 제곱합(WCSS)** = 각 점과 소속 군집 중심 간 거리 제곱의 총합을 최소화. 반복할 때마다 WCSS는 단조 감소하며 지역 최적해로 수렴한다.",
    "**한계**: k를 미리 정해야 함 / 초기 중심에 민감(→ K-means++로 완화) / 구형·크기가 비슷한 군집만 잘 찾음 / 평균을 쓰므로 이상치에 민감(→ K-medoids/PAM) / 범주형 데이터에 부적합(→ K-modes).",
    "**k 결정**: 엘보우 기법(WCSS 감소가 완만해지는 지점), 실루엣 계수 최대, Gap 통계량.",
  ]],
  ["exam",["'사전에 군집 수 지정, 적은 계산량으로 대규모 처리' = 비계층적(K-means). 초기값·이상치에 민감. 엘보우·실루엣으로 k 결정."]],
]},
{id:"c323", s:3, c:"3-2-1", t:"계층적 군집과 연결법", tag:["원리","비교"], b:[
  ["p","**계층적 군집**: 군집 수를 미리 정하지 않고, 가까운 것끼리 순차적으로 병합(응집형)하거나 분할(분리형)해 **덴드로그램**을 만든다. 원하는 높이에서 잘라 군집 수를 정한다."],
  ["table",["연결법","군집 간 거리 정의","경향"],[
    ["최단(단일)","두 군집에서 가장 가까운 점 쌍의 거리","사슬 효과(길게 늘어짐)"],
    ["최장(완전)","가장 먼 점 쌍의 거리","조밀한 구형 군집, 이상치 민감"],
    ["평균","모든 점 쌍 거리의 평균","중간적, 안정적"],
    ["중심","두 군집 중심 간 거리","역전 현상 가능"],
    ["Ward","병합 시 군집 내 제곱합(분산) 증가가 최소","크기 비슷한 조밀 군집, 실무 선호"],
  ]],
  ["exam",["계층적 = '군집 수 명시 불필요, 덴드로그램'. Ward = '오차제곱합 증가 최소'. 최단연결법 = 사슬 효과."]],
]},
{id:"c324", s:3, c:"3-2-1", t:"DBSCAN — 밀도 기반 군집", tag:["원리"], b:[
  ["p","**DBSCAN**: 두 파라미터 ε(반경)와 MinPts(최소 이웃 수)로, 밀도가 충분히 높은 영역을 군집으로 확장한다."],
  ["ul",[
    "**핵심점(core)**: 반경 ε 안에 MinPts 이상 이웃 보유. **경계점(border)**: core의 이웃이지만 자신은 core 아님. **잡음점(noise)**: 둘 다 아님 → 이상치.",
    "장점: 군집 수 자동 결정, **임의 모양** 군집 탐지, 이상치에 강건.",
    "단점: 밀도가 다양하면 하나의 ε로 부적합, 고차원에서 거리 개념 약화, 파라미터 민감.",
  ]],
  ["exam",["DBSCAN은 '군집 수 지정 불필요 + 비구형 군집 + 노이즈(이상치) 분리'. K-means와의 대비로 출제."]],
]},
{id:"c325", s:3, c:"3-2-1", t:"거리·유사도 척도 총정리", tag:["개념","비교","빈출"], b:[
  ["table",["척도","정의 / 용도"],[
    ["유클리드","√Σ(xᵢ−yᵢ)² — 두 점의 직선 거리(피타고라스)"],
    ["맨해튼","Σ|xᵢ−yᵢ| — 격자를 따라간 거리(택시 거리)"],
    ["민코프스키","(Σ|xᵢ−yᵢ|^m)^(1/m) — m=1이면 맨해튼, m=2이면 유클리드"],
    ["마할라노비스","변수 간 상관·분산을 반영한 거리(공분산 역행렬 사용) — 척도 불변"],
    ["코사인 유사도","두 벡터가 이루는 각의 코사인 — 크기 무시, 방향만. 문서·추천"],
    ["자카드","|교집합|/|합집합| — 집합·이진 데이터의 유사도"],
    ["해밍","다른 위치의 개수 — 범주형·이진 문자열"],
    ["상관계수 거리","1 − 피어슨 r"],
  ]],
  ["ul",["연속형: 유클리드·맨해튼·마할라노비스 / 범주·이진: 자카드·해밍·단순일치계수 / 텍스트: 코사인·자카드."]],
  ["exam",["민코프스키에서 m=1→맨해튼, m=2→유클리드. 마할라노비스 = '변수 간 상관관계 고려'. 자카드 = 집합 비유사도."]],
]},
{id:"c326", s:3, c:"3-2-2", t:"시계열 분석 — 성분·정상성·차분", tag:["개념","원리","빈출"], b:[
  ["ul",[
    "**구성 성분**: 추세(trend)·계절(seasonal)·순환(cycle)·불규칙(잔차/백색잡음).",
    "**분해법**: 시계열 = 추세 × 계절 × 불규칙(승법) 또는 합(가법)으로 분리.",
  ]],
  ["h","정상성(Stationarity)"],
  ["ul",[
    "모든 시점에서 **평균이 일정**, **분산이 일정**, 자기공분산이 **시차(lag)에만** 의존.",
    "정상 시계열은 평균으로 회귀하는 경향이 있어 예측·모델링이 용이.",
    "비정상 → 정상 전환: **차분**(추세 제거), **로그·Box-Cox 변환**(분산 안정화), 계절 차분.",
    "정상성 검정: ADF 검정, KPSS 검정.",
  ]],
  ["exam",["정상성 3조건(평균 일정·분산 일정·공분산은 시차에만 의존). 추세 있는 비정상 → 차분으로 정상화."]],
]},
{id:"c327", s:3, c:"3-2-2", t:"시계열 모형 — 이동평균·지수평활·AR·MA·ARIMA", tag:["개념","비교"], b:[
  ["table",["모형","설명"],[
    ["이동평균법","최근 n기간의 단순 평균으로 예측. n이 클수록 평활↑, 반응↓"],
    ["지수평활법","최근 데이터에 더 큰 가중치를 지수적으로 부여. 모든 과거를 사용. 단순·홀트(추세)·홀트-윈터스(계절)"],
    ["AR(p)","현재값 = 과거 p개 값들의 선형결합 + 오차 (자기회귀)"],
    ["MA(q)","현재값 = 과거 q개 '오차'들의 선형결합 (이동평균 오차모형)"],
    ["ARMA(p,q)","AR + MA 결합 — 정상 시계열용"],
    ["ARIMA(p,d,q)","d번 차분해 정상화한 뒤 ARMA 적용 — 비정상 시계열용. SARIMA는 계절 항 추가"],
  ]],
  ["ul",["모형 식별: ACF(자기상관함수)·PACF(부분자기상관함수) 그래프로 p, q를 추정."]],
  ["exam",["지수평활 = '최근값에 더 큰 가중치, 관찰기간 제한 없음'. ARIMA의 I = 차분(비정상성 처리). AR=과거값, MA=과거오차."]],
]},
{id:"c328", s:3, c:"3-2-2", t:"비모수 통계 검정", tag:["개념","비교"], b:[
  ["p","**비모수 검정**: 모집단 분포(정규성 등)를 가정하지 않고, 순위·부호 등으로 검정. 정규성이 의심되거나 표본이 작거나 서열척도일 때 사용."],
  ["table",["모수 검정","대응되는 비모수 검정","상황"],[
    ["일표본 t / 대응표본 t","부호검정, 윌콕슨 부호순위 검정","단일 중앙값 / 대응 2집단"],
    ["독립표본 t","만-휘트니 U 검정(윌콕슨 순위합)","독립 2집단"],
    ["일원분산분석(ANOVA)","크루스칼-왈리스 검정","독립 3집단 이상"],
    ["반복측정 ANOVA","프리드먼 검정","대응 3집단 이상"],
    ["피어슨 상관","스피어만·켄달 순위상관","두 변수 관계"],
    ["—","런 검정(runs test)","무작위성 검정"],
  ]],
  ["exam",["독립 2집단 비모수 = 만-휘트니. 3집단 이상 = 크루스칼-왈리스. 대응 2집단 = 윌콕슨 부호순위."]],
]},
{id:"c329", s:3, c:"3-1-1", t:"분석 모형 선정 — 종속변수 유무가 가르는 길", tag:["개념","의사결정"], b:[
  ["steps","분석 모형 선정 프로세스",[
    "**문제(요건) 정의** — 분석 목표와 유형(예측·진단·최적화) 설정.",
    "**데이터 수집·정리**.",
    "**데이터 전처리** — 후보 변수, 후보 알고리즘 파악.",
    "**분석 모형 선정** — 비즈니스 여건과 종속변수 유무로 결정.",
  ]],
  ["table",["종속변수","가능한 접근"],[
    ["있음 (지도학습)","분류(범주형 y)·회귀(연속형 y)"],
    ["없음 (비지도학습)","군집분석, 연관규칙, 이상치 탐지, 차원축소(원인/요인 분석)"],
  ]],
  ["ul",["분석 모형 유형: 예측 분석 모형 · 현황 진단 모형 · 최적화 분석 모형."]],
  ["exam",["'종속변수가 없으면 군집·연관·이상치·요인분석으로 제한된다' — 지문 그대로 출제."]],
]},
{id:"c330", s:3, c:"3-1-1", t:"가설검정 기반 분석 모델링 설계 절차", tag:["개념","프로세스"], b:[
  ["steps","분석 모델링 설계와 검정",[
    "유의수준(α) 결정, **귀무가설·대립가설 설정**.",
    "**검정통계량** 설정 (가설 검정 기준값).",
    "**기각역** 설정 (H₀를 기각하는 영역).",
    "표본에서 **검정통계량 계산** = (표본평균−모평균)/(표본표준편차) 형태.",
    "통계적 의사결정 — 검정통계량이 기각역에 들어가면 H₀ 기각.",
  ]],
  ["ul",[
    "**양측검정**: 대립가설이 '~가 아니다', 기각역 양쪽.",
    "**단측검정**: 대립가설이 '~보다 크다/작다', 기각역 한쪽.",
  ]],
  ["exam",["절차 순서(유의수준→가설→검정통계량→기각역→계산→결정). 단측/양측 판단 기준은 대립가설의 형태."]],

{id:"c331", s:3, c:"3-2-1", t:"회귀분석의 통계적 유의성 — F검정·t검정·결정계수", tag:["원리","계산","빈출"], b:[
